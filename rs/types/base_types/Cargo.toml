[package]
name = "ic-base-types"
version.workspace = true
authors.workspace = true
edition.workspace = true
description.workspace = true
documentation.workspace = true

[dependencies]
arbitrary = { workspace = true, optional = true }
bytes = { workspace = true }
candid = { workspace = true }
comparable = { workspace = true, features = ["derive"] }
ic-crypto-sha2 = { path = "../../crypto/sha2" }
ic-heap-bytes = { path = "../../../packages/ic-heap-bytes" }
ic-protobuf = { path = "../../protobuf" }
phantom_newtype = { path = "../../phantom_newtype" }
prost = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
ic-base-types-protobuf-generator = { path = "./protobuf_generator" }
ic-test-utilities-compare-dirs = { path = "../../test_utilities/compare_dirs" }
proptest = { workspace = true }
serde_cbor = { workspace = true }
tempfile = { workspace = true }

[features]
fuzzing_code = ["dep:arbitrary"]

[[bench]]
name = "canister_id"
harness = false
