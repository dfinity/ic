[package]
name = "nss_icos"
version.workspace = true
authors.workspace = true
edition.workspace = true
description.workspace = true
documentation.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "nss_icos"
crate-type = ["cdylib"]

[dependencies]
lazy_static = { workspace = true }
libc = { workspace = true }
libnss = { workspace = true }
nix = { workspace = true }
paste = { workspace = true }

# Test-only: deterministic_ips pulls in ic-types, which must not be linked into
# a library glibc dlopens into every process that resolves a host name.
[dev-dependencies]
deterministic_ips = { path = "../deterministic_ips" }
macaddr = { workspace = true }
