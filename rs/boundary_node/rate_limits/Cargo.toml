[package]
name = "rate_limits"
version.workspace = true
authors.workspace = true
edition.workspace = true
description.workspace = true
documentation.workspace = true

[dependencies]
anyhow = { workspace = true }
candid = { workspace = true }
getrandom = { workspace = true }
ic-canister-log = { path = "../../rust_canisters/canister_log" }
ic-cdk = { workspace = true }
ic-cdk-timers = { workspace = true }
ic-http-types = { path = "../../../packages/ic-http-types" }
ic-nns-constants = { path = "../../nns/constants" }
ic-stable-structures = "0.7.2"
mockall = { workspace = true }
prometheus.workspace = true
rand_chacha = { workspace = true }
rate-limits-api = { path = "./api" }
serde = { workspace = true }
serde_cbor = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
# Not the workspace uuid: its `v4` and `rng-getrandom` features don't compile for wasm32 in a Cargo
# build of this canister, which has no getrandom 0.4 backend.
uuid = { version = "1.29.3", features = ["serde"] }

[dev-dependencies]
candid_parser = { workspace = true }
# TODO: remove, with the test that uses it, once the workspace is on ic-stable-structures 0.7.
ic-stable-structures-0-6 = { package = "ic-stable-structures", version = "0.6.8" }
uuid = { workspace = true }

[lib]
crate-type = ["cdylib"]
path = "canister/lib.rs"
