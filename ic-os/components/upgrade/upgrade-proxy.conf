worker_processes 1;
pid /var/lib/ic/upgrade-proxy/nginx.pid;
error_log stderr notice;

events {
    worker_connections 512;
}

http {
    log_format upgrade '$remote_addr "$request_uri" $status '
                       'cache=$upstream_cache_status bytes=$body_bytes_sent '
                       'probe=$probe_status/$probe_length';
    access_log syslog:server=unix:/run/systemd/journal/dev-log,tag=upgrade_proxy,nohostname upgrade;

    client_body_temp_path /var/lib/ic/upgrade-proxy/tmp/client-body;
    proxy_temp_path       /var/lib/ic/upgrade-proxy/tmp/proxy;
    fastcgi_temp_path     /var/lib/ic/upgrade-proxy/tmp/fastcgi;
    uwsgi_temp_path       /var/lib/ic/upgrade-proxy/tmp/uwsgi;
    scgi_temp_path        /var/lib/ic/upgrade-proxy/tmp/scgi;

    proxy_cache_path /var/lib/ic/upgrade-proxy/cache
                     levels=1:2 keys_zone=artifacts:10m
                     max_size=10g min_free=2g inactive=365d use_temp_path=off;

    map $request_uri $artifact_hash {
        "~^/+(?<h>[0-9a-f]{64})/https://"                         $h;
        default                                                   "";
    }
    map $request_uri $artifact_url {
        "~^/+[0-9a-f]{64}/(?<u>https://[A-Za-z0-9.-]+/[^?#]*)$"   $u;
        default                                                   "";
    }

    map "$probe_status:$probe_length" $fetch_target {
        "~^200:[0-9]{1,9}$" $artifact_url;
        "~^200:"            "http://127.0.0.1:19301/";
        default             $artifact_url;
    }

    map $upstream_http_content_length $artifact_uncacheable {
        "~^[0-9]{1,9}$" 0;
        default         1;
    }

    server {
        listen 127.0.0.1:19301;
        access_log off;
        default_type text/plain;
        return 413 "artifact too large for the upgrade proxy; download it directly\n";
    }

    server {
        listen [::]:19300;
        resolver [2606:4700:4700::1111] [2606:4700:4700::1001] ipv4=off valid=300s;

        proxy_http_version      1.1;
        proxy_set_header        Accept-Encoding "";
        proxy_pass_request_body off;

        proxy_ssl_server_name         on;
        proxy_ssl_verify              on;
        proxy_ssl_verify_depth        3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        location / {
            if ($artifact_url != "") { rewrite ^ /_fetch last; }
            default_type text/plain;
            return 400 "usage: GET /hash/URL\n";
        }

        location = /_size_probe {
            internal;

            proxy_pass   $artifact_url;
            proxy_method HEAD;

            proxy_connect_timeout 15s;
            proxy_read_timeout    30s;

            proxy_intercept_errors on;
            error_page 301 302 307 308 403 404 416 500 502 503 504 = @probe_done;
        }

        location @probe_done {
            return 204;
        }

        location = /_fetch {
            internal;

            auth_request                   /_size_probe;
            auth_request_set $probe_status $upstream_status;
            auth_request_set $probe_length $upstream_http_content_length;

            proxy_pass   $fetch_target;
            proxy_method GET;

            proxy_cache              artifacts;
            proxy_cache_key          $artifact_hash;
            proxy_cache_valid        200 365d;
            proxy_cache_lock         on;
            proxy_cache_lock_age     6m;
            proxy_cache_lock_timeout 6m;
            proxy_cache_use_stale    error timeout updating http_500 http_502 http_503 http_504;

            proxy_no_cache           $artifact_uncacheable;
            proxy_max_temp_file_size 0;

            proxy_force_ranges on;

            proxy_connect_timeout 10s;
            proxy_read_timeout   60s;
            proxy_send_timeout   60s;

            proxy_hide_header Content-Type;
            add_header Content-Type "application/octet-stream" always;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
