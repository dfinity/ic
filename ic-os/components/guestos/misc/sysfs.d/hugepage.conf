# Hugepage configuration
#

kernel/mm/transparent_hugepage/shmem_enabled = advise

# A fault on `MADV_HUGEPAGE` memory (e.g. a canister's page delta) that finds no
# free 2 MiB block takes 4 KiB pages and wakes kswapd and kcompactd, instead of
# compacting and reclaiming synchronously (`madvise`). `never` would wake
# neither, leaving less memory free for the replica's own allocations.
kernel/mm/transparent_hugepage/defrag = defer
