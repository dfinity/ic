# LRU configuration
#

# The classic two-list LRU instead of the multi-gen LRU (MGLRU). Under heavy
# write load, MGLRU swaps out tens of GB of canister page deltas in bursts (at
# swappiness 60 as at 10), and the next checkpoint, reading them back, blocks
# execution for 30-600 s. The classic LRU doesn't.
kernel/mm/lru_gen/enabled = 0
