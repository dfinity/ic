[Unit]
After=generate-metrics-proxy-config.service
# Wants, not Requires: a Requires= would cancel this unit's start job if
# generation failed, and nothing would start it after the generator's retry.
Wants=generate-metrics-proxy-config.service

[Service]
# HostOS generates its config: the number of GuestOS VMs and their addresses
# follow from the node's reward type.
ExecStart=
ExecStart=/opt/ic/bin/metrics-proxy /run/ic-node/etc/metrics-proxy.yaml
