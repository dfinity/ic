[package]
name = "ic-hpke"
version = "0.1.0"
description = "A package created for the Internet Computer Protocol for Hybrid Public Key Encryption"
license = "Apache-2.0"
readme = "README.md"
include = ["src", "Cargo.toml", "CHANGELOG.md", "LICENSE", "README.md"]
repository = "https://github.com/dfinity/ic"
authors.workspace = true
edition.workspace = true
documentation.workspace = true

[dependencies]
hpke = { version = "0.15.1", default-features = false, features = [ "nistp", "aes", "alloc" ] }

[dev-dependencies]
hex = { workspace = true }
rand = { workspace = true, features = ["sys_rng"] }
rand_chacha = { workspace = true }
