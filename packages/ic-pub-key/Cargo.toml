[package]
name = "ic-pub-key"
version = "0.3.0"
description = "A package created for the Internet Computer Protocol for (offline) derivation of threshold public keys"
license = "Apache-2.0"
readme = "README.md"
include = ["src", "Cargo.toml", "CHANGELOG.md", "LICENSE", "README.md"]
repository = "https://github.com/dfinity/ic"
authors.workspace = true
edition.workspace = true
documentation.workspace = true

[features]
default = ["secp256k1", "secp256r1", "ed25519", "vetkeys"]

secp256k1 = ["dep:ic-secp256k1"]
secp256r1 = ["dep:ic-secp256r1"]
ed25519 = ["dep:ic-ed25519"]
vetkeys = ["dep:ic-vetkeys", "dep:ic-cdk-management-canister"]

[dependencies]
ic-secp256k1 = { path = "../ic-secp256k1", version = "0.3.0", optional = true }
ic-secp256r1 = { path = "../ic-secp256r1", version = "0.3.0", optional = true }
ic-ed25519 = { path = "../ic-ed25519", version = "0.6.0", optional = true }
ic-vetkeys = { workspace = true, optional = true }
ic-cdk-management-canister = { workspace = true, optional = true }
# The in-repo crate, since the workspace's version has no `EcdsaCurve::Secp256r1`.
# This crate re-exports its types, so each breaking release of it also needs a
# breaking release of this crate.
ic-management-canister-types = { path = "../ic-management-canister-types", version = "0.11.0" }

[dev-dependencies]
hex = { workspace = true }
