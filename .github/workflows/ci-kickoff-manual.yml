name: CI Kickoff Manual

on:
  workflow_dispatch:
    inputs:
      commit-sha:
        description: 'The head commit of the PR (CI Main runs on its merge into master)'
        required: true
        default: ''
      pr-number:
        description: 'The PR number' # this is used for posting comments with the CI link
        required: true
        default: ''
      confirm:
        description: 'Check this box to confirm you have reviewed the PR at the specified commit'
        required: true
        type: boolean

jobs:
  verify-inputs-and-get-pr-refs:
    name: Verify Inputs and Get PR Refs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base-ref: ${{ steps.fetch.outputs.base_ref }}
      head-ref: ${{ steps.fetch.outputs.head_ref }}
      head-repo: ${{ steps.fetch.outputs.head_repo }}
      merge-sha: ${{ steps.fetch.outputs.merge_sha }}
    steps:
      - name: Verify Commit Is PR Head and Fetch PR Refs
        id: fetch
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
          COMMIT_SHA: ${{ inputs.commit-sha }}
          CONFIRM: ${{ inputs.confirm }}
        with:
          script: |
            // For boolean workflow_dispatch inputs, 'required: true' does not
            // enforce that the box is ticked, so check it here.
            if (process.env.CONFIRM !== 'true') {
              core.setFailed('confirm must be checked: it acknowledges that you reviewed ' +
                             'the PR at the specified commit');
              return;
            }

            // Match on the raw string: Number() would also accept forms like
            // '0x10', '1e3' or ' 12 ', which would target a different PR.
            if (!/^[1-9][0-9]*$/.test(process.env.PR_NUMBER || '')) {
              core.setFailed(`pr-number must be a positive decimal integer, got: ${process.env.PR_NUMBER}`);
              return;
            }
            const prNumber = Number(process.env.PR_NUMBER);
            const sha = (process.env.COMMIT_SHA || '').toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed('commit-sha must be a full 40-character commit SHA');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            if (pr.state !== 'open') {
              core.setFailed(`PR #${prNumber} is ${pr.state}, refusing to run CI on it`);
              return;
            }

            // Require the head commit: the confirm checkbox states the PR was
            // reviewed at this commit, and an older commit of the PR would run
            // CI on code that is no longer what the PR proposes to merge.
            if (sha !== pr.head.sha.toLowerCase()) {
              core.setFailed(`Commit ${sha} is not the head of PR #${prNumber} ` +
                             `(head is ${pr.head.sha}). Re-run with the head commit.`);
              return;
            }

            // CI Main runs on GitHub's test merge of the PR into master, as it does
            // for PRs from this repository (refs/pull/N/merge). Other base branches
            // are refused, so the PR is merged with a commit on master. GitHub
            // updates the merge lazily, so that commit can be behind master's tip.
            if (pr.base.ref !== 'master') {
              core.setFailed(`PR #${prNumber} targets ${pr.base.ref}, but this workflow only ` +
                             'runs CI on PRs into master. Retarget it to master, then re-run.');
              return;
            }

            // GitHub computes the test merge in the background: mergeable is null
            // until it is done. Every re-fetch must still pass the checks above.
            let current = pr;
            for (let attempt = 0; current.mergeable === null && attempt < 10; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 3000));
              current = (await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              })).data;
              if (current.state !== 'open' || current.base.ref !== 'master' ||
                  current.head.sha.toLowerCase() !== sha) {
                core.setFailed(`PR #${prNumber} changed while waiting for its test merge ` +
                               `(state ${current.state}, base ${current.base.ref}, ` +
                               `head ${current.head.sha}). Review it again before re-running.`);
                return;
              }
            }
            if (current.mergeable === null) {
              core.setFailed(`GitHub has not finished merging PR #${prNumber} into master ` +
                             'for testing. Re-run in a minute.');
              return;
            }
            if (!current.mergeable) {
              core.setFailed(`PR #${prNumber} conflicts with master. Ask the contributor ` +
                             'to rebase it on master.');
              return;
            }

            // Pin the test merge by SHA: refs/pull/N/merge moves when the contributor
            // pushes or master moves, and every job must test the same reviewed code.
            // Its parents are the master commit it merges into and the PR head.
            const mergeSha = current.merge_commit_sha;
            const { data: merge } = await github.rest.git.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: mergeSha
            });
            const parents = merge.parents.map(parent => parent.sha.toLowerCase());
            if (parents.length !== 2 || parents[1] !== sha) {
              core.setFailed(`The test merge ${mergeSha} of PR #${prNumber} does not merge ` +
                             `${sha} (its parents are ${parents.join(', ')}). GitHub may ` +
                             'still be updating it: re-run in a minute.');
              return;
            }
            // With master as the base, the comparison of a commit on master has no diff.
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `master...${parents[0]}`,
              per_page: 1
            });
            if (comparison.status !== 'behind' && comparison.status !== 'identical') {
              core.setFailed(`The test merge ${mergeSha} of PR #${prNumber} merges into ` +
                             `${parents[0]}, which is not on master. GitHub may still be ` +
                             'updating it: re-run in a minute.');
              return;
            }

            // Empty if the fork was deleted after the PR was opened. Jobs that
            // push to the head branch compare this against github.repository and
            // skip the push unless the branch lives in this repository.
            const headRepo = pr.head.repo ? pr.head.repo.full_name : '';
            core.info(`PR #${prNumber} base ref: ${pr.base.ref}, ` +
                      `head ref: ${pr.head.ref}, head repo: ${headRepo}, ` +
                      `test merge: ${mergeSha} into master commit ${parents[0]} ` +
                      `(${comparison.behind_by} commits behind master)`);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_repo', headRepo);
            core.setOutput('merge_sha', mergeSha);

  ci-main:
    name: CI Main
    needs: [verify-inputs-and-get-pr-refs]
    uses: ./.github/workflows/ci-main.yml
    secrets: inherit
    with:
      # The reviewed head merged into master. CI PR Only and the statuses use the head itself.
      commit-sha: ${{ needs.verify-inputs-and-get-pr-refs.outputs.merge-sha }}
      release-build: 'false'
    permissions:
      actions: write
      contents: read
      id-token: write
      pull-requests: read

  ci-pr-only:
    name: CI PR Only
    needs: [verify-inputs-and-get-pr-refs]
    uses: ./.github/workflows/ci-pr-only.yml
    secrets: inherit
    with:
      commit-sha: ${{ inputs.commit-sha }}
      base-ref: ${{ needs.verify-inputs-and-get-pr-refs.outputs.base-ref }}
      head-ref: ${{ needs.verify-inputs-and-get-pr-refs.outputs.head-ref }}
      head-repo: ${{ needs.verify-inputs-and-get-pr-refs.outputs.head-repo }}
      pr-number: ${{ inputs.pr-number }}
    permissions:
      contents: read
      pull-requests: write

  post-required-check-status-ci-main:
    name: CI Main Required Check Status
    runs-on: ubuntu-latest
    needs: [ci-main]
    if: success() || failure()
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit-sha }}
      - uses: ./.github/actions/post-commit-status
        with:
          commit-sha: ${{ inputs.commit-sha }}
          run-result: ${{ needs.ci-main.result }}
          name: ci-main-status

  post-required-check-status-ci-pr-only:
    name: CI PR Only Post Required Check Status
    runs-on: ubuntu-latest
    needs: [ci-pr-only]
    if: success() || failure()
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit-sha }}
      - uses: ./.github/actions/post-commit-status
        with:
          commit-sha: ${{ inputs.commit-sha }}
          run-result: ${{ needs.ci-pr-only.result }}
          name: ci-pr-only-status

  post-comment-with-ci-link:
    name: Post Comment with CI Link
    runs-on: ubuntu-latest
    needs: [verify-inputs-and-get-pr-refs]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Add PR Comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
          COMMIT_SHA: ${{ inputs.commit-sha }}
          MERGE_SHA: ${{ needs.verify-inputs-and-get-pr-refs.outputs.merge-sha }}
        with:
          script: |
            // Both inputs were validated by verify-inputs-and-get-pr-refs, which
            // this job depends on and which looked up MERGE_SHA.
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                           `/actions/runs/${context.runId}`;
            const message = `Run on ${process.env.COMMIT_SHA} (CI Main on its merge into ` +
                            `master, ${process.env.MERGE_SHA}) URL: ${runUrl}\n\n`;

            await github.rest.issues.createComment({
              issue_number: Number(process.env.PR_NUMBER),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

  notify-slack-new-workflow-run:
    name: Notify Slack for new External Contributor Workflow Run
    runs-on: ubuntu-latest
    needs: [verify-inputs-and-get-pr-refs]
    steps:
      - name: Post to a Slack channel
        id: slack
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001 # v1.25.0
        with:
          channel-id: ${{ secrets.EXT_WORKFLOW_RUN_CHANNEL }} # for security reasons, keep this masked
          slack-message: "External Contribution Workflow Run Started: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_API_TOKEN }}
