name: Schedule Daily Bare Metal tests

on:
  schedule:
    - cron: "47 1 * * *" # 1:47 UTC - slightly offset to avoid high-load times of other scheduled workflows
  workflow_dispatch:

env:
  CI_JOB_NAME: ${{ github.job }}

jobs:
  bazel-test-bare-metal:
    name: Bazel Test Bare Metal
    runs-on: &dind-large-setup
      labels: dind-large
    container: &container-setup
      image: ghcr.io/dfinity/ic-build@sha256:6184a4beddca0e898c9e2113b2dd78f0391caefef7c13090c56ae1ab7b1ec399
      options: >-
        -e NODE_NAME --privileged --cgroupns host --mount type=tmpfs,target="/tmp/containers"
    environment: Bare Metal Tests
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Write the bare metal secrets to files
        # Not in the environment of the next step, whose BEP files record it.
        shell: bash
        env:
          ZH2_DLL01_INI_SECRET: "${{ secrets.ZH2_DLL01_INI_SECRET }}"
          ZH2_FILE_SHARE_KEY: "${{ secrets.ZH2_FILE_SHARE_KEY }}"
        run: |
          echo "$ZH2_DLL01_INI_SECRET" > zh2-dll01-ini-secret
          echo "$ZH2_FILE_SHARE_KEY" > zh2-file-share-key && chmod 400 zh2-file-share-key

          # The runner masks the secret only as a whole and line by line, not the BMC password on its own.
          python3 -I - zh2-dll01-ini-secret <<'EOF'
          import configparser, sys
          config = configparser.ConfigParser()
          try:
              config.read(sys.argv[1])
              # The raw password, and the interpolated one that deploy.py reads.
              passwords = {config.get("host", "password", raw=True), config.get("host", "password")}
          except Exception:
              # Not the exception itself: its message can contain parts of the INI.
              print("::error::Cannot read the [host] password from ZH2_DLL01_INI_SECRET.")
              sys.exit(1)
          for password in passwords:
              print("::add-mask::" + password.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          EOF
      - name: Run Bazel Launch Bare Metal
        uses: ./.github/actions/bazel
        with:
          run: |
            launch_bare_metal() {

              # shellcheck disable=SC2046,SC2086
              bazel run \
                //ic-os/setupos/envs/dev:launch_bare_metal -- \
                  --config_path "$(realpath  ./ic-os/dev-tools/bare_metal_deployment/zh2-dll01.yaml)" \
                  --ini_filename "$(realpath zh2-dll01-ini-secret)" \
                  --file_share_ssh_key "$(realpath zh2-file-share-key)" \
                  --inject_image_pub_key "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK3gjE/2K5nxIBbk3ohgs8J5LW+XiObwA+kGtSaF5+4c" \
                  --file_share_username ci_interim \
                  --ci_mode \
                  $@
            }

            # Run bare metal installation test
            launch_bare_metal --hsm

            # Run bare metal node performance benchmarks
            launch_bare_metal --benchmark

            # Run bare metal node hostOS metrics check
            launch_bare_metal --check_hostos_metrics

            # Run SEV tests
            bazel test //rs/tests/nested:guestos_upgrade_from_current_to_current_test_sev_farm --test_env=BARE_METAL_HOST_SECRETS="$(realpath zh2-dll01-ini-secret)"
            bazel test //rs/tests/nested:guestos_upgrade_from_latest_release_to_current_sev_farm --test_env=BARE_METAL_HOST_SECRETS="$(realpath zh2-dll01-ini-secret)"
            bazel test //rs/tests/nested:hostos_upgrade_from_latest_release_to_current_sev_farm --test_env=BARE_METAL_HOST_SECRETS="$(realpath zh2-dll01-ini-secret)"
            bazel test //rs/tests/nested:sev_recovery_farm --test_env=BARE_METAL_HOST_SECRETS="$(realpath zh2-dll01-ini-secret)"

            bazel clean
          GPG_PASSPHRASE: ${{ secrets.BEP_GPG_PASSPHRASE }}
