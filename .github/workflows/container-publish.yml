# Builds and publishes the ic-build and ic-dev images for a run of
# "Container IC Build Image" (container-autobuild.yml), mirrors ic-build to the
# Namespace registry for RBE, and commits TAG, the digest pins and the worker
# image reference to that run's branch.
#
# As a workflow_run workflow it always executes this file from master, on
# master's ref, whatever the triggering pull request changes in its own copy of
# the workflows. The publish-container-images environment, which holds the
# machine-account token (secret GHCR_PUSH_TOKEN, variable GHCR_PUSH_USERNAME),
# restricts deployments to master, so no pull_request run can obtain it.
# Nothing from the triggering commit's checkout is executed here: the recipe
# hash is computed inline, the Dockerfile's instructions run inside BuildKit,
# and the commit step only edits files. The recipe tag is the hash of
# Dockerfile, init.sh and files/*, which is everything the Dockerfile takes
# from the checkout, and a recipe tag is written once: if it already exists,
# the image it names is reused and nothing is pushed. A tag therefore only
# ever names the image master's workflow first built from a recipe hashing to
# it. The ghcr.io/dfinity/ic-build and ic-dev packages must grant this
# repository's GITHUB_TOKEN read access only; ghcr-push-canary.yml checks that
# daily.
name: Container Publish

on:
  workflow_run:
    workflows:
      - Container IC Build Image
    types:
      - completed

# Eligible runs for one branch replace each other. A run that prep skips (a
# fork, or an unsuccessful upstream run) gets a group of its own, so that it
# cannot cancel a run that publishes for the same branch name.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) && format('{0}/{1}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch) || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  prep:
    name: Compare the recipe hash with TAG
    runs-on: ubuntu-latest
    # Same-repository runs only: a fork cannot receive the bot commit, and the
    # dfinity/ic-private mirror does not publish.
    if: |
      github.repository == 'dfinity/ic' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
    outputs:
      build_image: ${{ steps.decide.outputs.build_image }}
      image_tag: ${{ steps.decide.outputs.image_tag }}
      source_sha: ${{ steps.decide.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The pull request's merge commit, which is what CI tests, for
          # pull_request runs; the pushed commit otherwise. It is resolved to one
          # SHA below so that every job builds the same recipe.
          ref: ${{ github.event.workflow_run.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.workflow_run.pull_requests[0].number) || github.event.workflow_run.head_sha }}

      - name: Compare the recipe hash with TAG
        id: decide
        env:
          EVENT: ${{ github.event.workflow_run.event }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        # The rule of ci/container/get-image-tag.sh, inline rather than by running
        # the script from the triggering commit. The two must agree: change the
        # rule here, on master, before changing the script.
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          # The merge ref is rebuilt when the pull request moves on; then the run
          # for its new head publishes, not this one.
          if [ "$EVENT" = pull_request ] && ! git cat-file -p HEAD | grep -q "^parent $HEAD_SHA\$"; then
            echo "::notice::the pull request moved on from $HEAD_SHA; the run for its new head publishes instead"
            echo "build_image=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          image_tag="$(sha256sum ci/container/Dockerfile ci/container/init.sh ci/container/files/* | sha256sum | cut -d' ' -f1)"
          if [ "$image_tag" = "$(<ci/container/TAG)" ]; then
            echo "ci/container/TAG already names the recipe hash $image_tag; nothing to build."
            echo "build_image=false" >> "$GITHUB_OUTPUT"
          else
            echo "build_image=true" >> "$GITHUB_OUTPUT"
          fi
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build Container Image ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [prep]
    if: needs.prep.outputs.build_image == 'true'
    timeout-minutes: 60
    environment: publish-container-images
    permissions:
      contents: read
    # Serializes the lookup-through-push of one tag across branches: two runs
    # with the same new recipe hash must not both find it missing and both
    # push. A run that waits here finds the tag and reuses it. (GitHub keeps
    # one pending job per group; a third run's job is cancelled and that branch
    # gets its pins from its next container change.)
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.image }}-${{ needs.prep.outputs.image_tag }}
      cancel-in-progress: false
    strategy:
      matrix:
        include:
          - image: ic-build
            target: build
          - image: ic-dev
            target: dev
    outputs:
      ic-build-imagedigest: ${{ steps.set-output-imagedigest.outputs.ic-build-imagedigest }}
      ic-dev-imagedigest: ${{ steps.set-output-imagedigest.outputs.ic-dev-imagedigest }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prep.outputs.source_sha }}

      - name: Reuse the image if the recipe tag already exists
        id: existing
        # A recipe tag is written once. The hash covers the recipe files' content,
        # so a recipe with the same content but, say, other file modes must not
        # replace what the tag names; and a partly failed run can be repeated.
        # To rebuild a recipe, change it (a comment in the Dockerfile will do).
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ needs.prep.outputs.image_tag }}
        run: |
          set -euo pipefail
          token="$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:dfinity/$IMAGE:pull" | jq -r .token)"
          accept='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
          headers="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' -I -H "Authorization: Bearer $token" -H "Accept: $accept" "https://ghcr.io/v2/dfinity/$IMAGE/manifests/$TAG")"
          case "$code" in
            200)
              digest="$(grep -i '^docker-content-digest:' "$headers" | tr -d '\r' | awk '{print $2}')"
              [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
              echo "ghcr.io/dfinity/$IMAGE:$TAG already exists and names $digest; reusing it"
              echo "digest=$digest" >> "$GITHUB_OUTPUT"
              ;;
            404) echo "ghcr.io/dfinity/$IMAGE:$TAG does not exist yet; building it" ;;
            *)
              echo "::error::ghcr.io answered HTTP $code for ghcr.io/dfinity/$IMAGE:$TAG"
              exit 1
              ;;
          esac

      - name: Set up Docker Buildx
        if: steps.existing.outputs.digest == ''
        uses: docker/setup-buildx-action@a530e948adbeb357dbca95a7f8845d385edf4438 # v3

      - name: Login to GHCR
        if: steps.existing.outputs.digest == ''
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_PUSH_USERNAME }}
          password: ${{ secrets.GHCR_PUSH_TOKEN }}

      - name: Build Container Image ${{ matrix.image }}
        if: steps.existing.outputs.digest == ''
        # this sets the output 'digest' to the sha256 of the output image
        uses: docker/build-push-action@eb539f44b153603ccbfbd98e2ab9d4d0dcaf23a4 # v5
        id: build
        with:
          context: .
          file: ci/container/Dockerfile
          push: true
          tags: ghcr.io/dfinity/${{ matrix.image }}:${{ needs.prep.outputs.image_tag }}
          target: ${{ matrix.target }}

      - name: Set output image digest
        id: set-output-imagedigest
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "${{ matrix.image }}-imagedigest=$DIGEST" >> "$GITHUB_OUTPUT"

  rbe-worker-image:
    name: Create Remote Build Execution Worker Image @ Namespace
    runs-on: namespace-profile-default;permissions.additional_grant=baseimage:*:*
    permissions: {}
    needs: [prep, build]
    if: needs.prep.outputs.build_image == 'true'
    timeout-minutes: 30
    outputs:
      worker-image: ${{ steps.worker.outputs.worker-image }}
    steps:
      - name: Mirror ic-build to nscr.io and optimize it for Remote Build Execution @ Namespace
        id: worker
        shell: bash
        run: |
          set -xeuo pipefail
          nsc docker login
          ic_build_repo="ghcr.io/dfinity/ic-build"
          src="${ic_build_repo}@${{ needs.build.outputs.ic-build-imagedigest }}"
          upload_log="$(mktemp)"
          nsc base-image upload "$src" "ic-build:${{ needs.prep.outputs.image_tag }}" 2>&1 | tee "$upload_log"
          worker_digest="$(grep -i 'Uploaded base image' "$upload_log" | grep -oE 'sha256:[0-9a-f]{64}' | tail -n1 || true)"
          : "${worker_digest:?could not parse pushed image digest from nsc base-image upload output}"
          worker_image="${NSC_CONTAINER_REGISTRY}/ic-build@${worker_digest}"
          echo "Resolved worker image: $worker_image"
          nsc base-image optimize --image_ref "$worker_image"
          echo "worker-image=$worker_image" >> "$GITHUB_OUTPUT"

  update-image-references:
    name: Update Image References in Repo
    runs-on: ubuntu-latest
    needs: [prep, build, rbe-worker-image]
    if: needs.prep.outputs.build_image == 'true'
    permissions:
      pull-requests: write # the comment; the commit is pushed with the app token
    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ vars.PR_CREATION_BOT_APP_ID }}
          private-key: ${{ secrets.PR_CREATION_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Check that the branch still has the recipe that was built
        id: guard
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          IMAGE_TAG: ${{ needs.prep.outputs.image_tag }}
        # The pins describe a recipe. If the branch moved on with that recipe
        # unchanged (an unrelated push, which on a dev-gh-* branch does not
        # trigger another run) they are committed to its new head; if its
        # recipe changed, the push that changed it triggered the run that
        # publishes for the new head. A push that races this check is rejected
        # by the non-forced push below.
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            tip_tag="$(sha256sum ci/container/Dockerfile ci/container/init.sh ci/container/files/* | sha256sum | cut -d' ' -f1)"
            if [ "$tip_tag" = "$IMAGE_TAG" ]; then
              echo "::notice::the branch moved on from $HEAD_SHA with its recipe unchanged; committing the pins to its new head"
            else
              echo "::notice::the branch moved on from $HEAD_SHA and its recipe changed; the run for its new head publishes instead (dispatch Container IC Build Image on it if none runs)"
              echo "stale=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Update Image References
        if: steps.guard.outputs.stale != 'true'
        shell: bash
        # Edits files only; nothing from the checkout is executed. ci-main's
        # test-container-run job runs ci/container/check-image-pins.sh on the
        # resulting commit.
        run: |
          set -xeuo pipefail

          IMAGE_PREFIX="ghcr.io/dfinity/"
          IC_BUILD_DIGEST='${{ needs.build.outputs.ic-build-imagedigest }}'
          IC_DEV_DIGEST='${{ needs.build.outputs.ic-dev-imagedigest }}'
          for digest in "$IC_BUILD_DIGEST" "$IC_DEV_DIGEST"; do
            if ! [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::malformed image digest '$digest'"
              exit 1
            fi
          done
          IMG_NAME_IC_BUILD="${IMAGE_PREFIX}ic-build@${IC_BUILD_DIGEST}"
          IMG_NAME_IC_DEV="${IMAGE_PREFIX}ic-dev@${IC_DEV_DIGEST}"

          echo '${{ needs.prep.outputs.image_tag }}' > ci/container/TAG
          echo "$IC_BUILD_DIGEST" > ci/container/ic-build.digest
          echo "$IC_DEV_DIGEST" > ci/container/ic-dev.digest
          # Re-point every reference to either image, by tag or by digest, under
          # .devcontainer/ and .github/: the scope ci/container/check-image-pins.sh
          # verifies, with its pattern. grep -r only lists regular files (sed -i
          # fails on directories like actions/bazel/bin) and fails the step if there
          # are none.
          repoint() { # <image> <new reference>
            local re="ghcr\.io/dfinity/${1}(:|@)[A-Za-z0-9:._-]+"
            grep -rlZE -- "$re" .devcontainer .github | xargs -0 -r sed -i -E "s#${re}#${2}#g" --
          }
          repoint ic-build "$IMG_NAME_IC_BUILD"
          repoint ic-dev "$IMG_NAME_IC_DEV"
          pushd .github
          # The RBE worker image is also referenced outside workflows/, by
          # actions/bazel-namespace/rbe.bazelrc, so rewrite it in every file under .github that
          # references it (the pattern is anchored on the digest). grep -r only lists regular files
          # (sed -i fails on directories like actions/bazel/bin) and fails the step if there are none.
          WORKER_IMAGE='${{ needs.rbe-worker-image.outputs.worker-image }}'
          worker_image_re='nscr\.io/[^"/]+/ic-build@sha256:[0-9a-f]{64}'
          grep -rlZE -- "$worker_image_re" . | xargs -0 -r sed -i -E "s|${worker_image_re}|${WORKER_IMAGE}|g" --
          popd

          git config --global user.name "IDX GitHub Automation"
          git config --global user.email "<>"
          git add .
          git commit \
            -m 'Updating container images to tag: ${{ needs.prep.outputs.image_tag }}' \
            -m 'ic-build: ${{ needs.build.outputs.ic-build-imagedigest }}' \
            -m 'ic-dev:   ${{ needs.build.outputs.ic-dev-imagedigest }}'
          git push

      - name: Add PR Comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        if: steps.guard.outputs.stale != 'true' && github.event.workflow_run.pull_requests[0] != null
        with:
          script: |
            const prNumber = ${{ github.event.workflow_run.pull_requests[0].number }};
            // Hidden marker used to find this workflow's comment on subsequent runs
            const marker = '<!-- container-autobuild-image-tag -->';
            let message = marker + '\n'
            message += 'Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n'
            message += 'New container images with tag: `${{ needs.prep.outputs.image_tag }}`\n'
            message += 'ic-build: `${{ needs.build.outputs.ic-build-imagedigest }}`\n'
            message += 'ic-dev: `${{ needs.build.outputs.ic-dev-imagedigest }}`\n'

            // Find existing comment from this workflow
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes(marker)
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: message
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: message
              });
            }
