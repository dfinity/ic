name: Kickoff

on:
  merge_group:
  push:
    branches:
      - master
      - 'dev-gh-*'
  pull_request:
    branches-ignore:
      - hotfix-* # This is to ensure that this workflow is not triggered twice on ic-private, as it's already triggered from release-testing
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-main:
    name: CI Main
    # for dfinity/ic: run on all events except on PRs from forks
    # for dfinity/ic-private: only run on PRs
    if: |
      (github.repository == 'dfinity/ic' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) ||
      (github.repository == 'dfinity/ic-private' && github.event_name == 'pull_request')
    uses: ./.github/workflows/ci-main.yml
    secrets: inherit
    with:
      commit-sha: ${{ github.sha }}
    permissions:
      actions: write
      # The upload jobs of ci-main.yml attest what they uploaded; only release
      # builds upload. The grant also applies to this workflow's pull-request,
      # merge-group, dev-gh-* and workflow_dispatch runs, which never upload: an
      # attestation minted from one of those would carry that run's ref
      # (refs/pull/N/merge, refs/heads/gh-readonly-queue/...,
      # refs/heads/dev-gh-*, the dispatched ref) and commit, which the release
      # workflows consuming attestations reject unless a dispatch picked master,
      # which then runs nothing but master's own tree: this workflow's dispatch
      # takes no inputs.
      attestations: write
      contents: read
      id-token: write
      pull-requests: read

  ci-pr-only:
    name: CI PR Only
    # only run on PRs and not forked PRs
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/ci-pr-only.yml
    secrets: inherit
    with:
      commit-sha: ${{ github.sha }}
    permissions:
      contents: read
      pull-requests: write


  # This job runs a bazel build & test on the Remote Build Execution cluster @ Namespace.
  # It's currently in the evaluation phase where we compare its speed and stability with the `bazel-test-all` job.
  # We expect it to fail and that's OK and it shouldn't block PRs & releases.
  ci-rbe-evaluation:
    name: CI RBE Evaluation
    # Like ci-main: for dfinity/ic on all events except on PRs from forks, for dfinity/ic-private
    # (where Namespace runners were enabled on 2026-11-05) only on PRs.
    if: |
      (github.repository == 'dfinity/ic' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) ||
      (github.repository == 'dfinity/ic-private' && github.event_name == 'pull_request')
    uses: ./.github/workflows/ci-rbe-evaluation.yml
    secrets: inherit
    with:
      commit-sha: ${{ github.sha }}
    permissions:
      contents: read
      # Its rehearsal of bazel-test-all's Configure AWS credentials step (release builds only).
      id-token: write

  # Temporary, until bazel-test-all runs on RBE: the build-determinism check of ci-main.yml for the
  # build of the RBE evaluation, i.e. the execution log of its build step against the one of build-ic
  # (both reusable workflows upload their artifacts to this run). It shows, before the switch, that the
  # artifacts built on RBE @ Namespace equal the ones built from scratch on DFINITY's runners.
  rbe-build-determinism:
    name: RBE Build Determinism (shadow)
    runs-on: ubuntu-latest
    needs: [ci-main, ci-rbe-evaluation]
    # build-ic doesn't run on merge_group (nothing to compare); both called workflows are skipped for
    # PRs from forks. Informational only: it never blocks.
    if: ${{ !cancelled() && github.event_name != 'merge_group' && needs.ci-main.result != 'skipped' && needs.ci-rbe-evaluation.result != 'skipped' }}
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Download execution logs (cache, RBE)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: execlogs-bazel-build-rbe
          path: execlogs-cache
      - name: Download execution logs (nocache)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: execlogs-build-ic
          path: execlogs-nocache
      - name: Build Determinism Test
        # Same as the Build Determinism Test step of ci-main.yml, keep them in sync.
        run: |
          set -euo pipefail

          n_lines_cache=$(cat execlogs-cache/execlogs.csv | wc -l)
          n_lines_nocache=$(cat execlogs-nocache/execlogs.csv | wc -l)
          echo "comparing $n_lines_cache (cache) and $n_lines_nocache (nocache) lines"

          warn_if_low_coverage() { # <number of artifacts present in both>
            if [ "${{ github.event_name }}" != "pull_request" ] && [ "$1" -lt $((n_lines_nocache / 2)) ]; then
              echo "::warning title=RBE Build Determinism::only $1 of the $n_lines_nocache artifacts built by build-ic are in the execution log of the RBE build"
            fi
          }

          if [ "$n_lines_cache" -eq 0 ] || [ "$n_lines_nocache" -eq 0 ]; then
            warn_if_low_coverage 0
            echo "No lines to compare"
            exit 0
          fi

          sponge=$(mktemp)

          sort -t, -k2 <execlogs-cache/execlogs.csv >"$sponge"
          cp "$sponge" execlogs-cache/execlogs.csv

          sort -t, -k2 <execlogs-nocache/execlogs.csv >"$sponge"
          cp "$sponge" execlogs-nocache/execlogs.csv

          rm "$sponge"

          n_joined=$(join -t, -12 -22 execlogs-cache/execlogs.csv execlogs-nocache/execlogs.csv | wc -l)
          echo "comparing $n_joined artifacts present in both"
          warn_if_low_coverage "$n_joined"

          join \
            -t, -o 1.1,1.2,1.3,2.3 -12 -22 \
            execlogs-cache/execlogs.csv \
            execlogs-nocache/execlogs.csv \
            | awk -F, 'BEGIN { N_BAD=0; } $3 != $4 { print $1 " " $2 ": " $3 " != " $4; N_BAD++; } END { if (N_BAD) { print N_BAD " mismatches found"; exit 1; } else { print "No mismatches"; }; }' \
            | column -t | sort

## Explanation on the below jobs for posting required checks:
## For accepting external contributions we need to trigger the workflow from `workflow_dispatch`, not the pull_request directly
## We use status checks to post the result back to the PR and mark those checks as "required"

  post-required-check-status-ci-main:
    name: CI Main Required Check Status
    runs-on: ubuntu-latest
    needs: [ci-main]
    # only run this job on pull requests or merge queues, but run it regardless of the previous result
    if: (success() || failure()) && ( github.event_name == 'pull_request' || github.event_name == 'merge_group' )
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/post-commit-status
        with:
          # on pull requests the github.sha is the merge commit - here we use the head commit so that it will show up on PRs
          commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          run-result: ${{ needs.ci-main.result }}
          name: ci-main-status

  post-required-check-status-ci-pr-only:
    name: CI PR Only Post Required Check Status
    runs-on: ubuntu-latest
    needs: [ci-pr-only]
    if: (success() || failure()) && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/post-commit-status
        with:
          # on pull requests the github.sha is the merge commit - here we use the head commit so that it will show up on PRs
          commit-sha: ${{ github.event.pull_request.head.sha }}
          run-result: ${{ needs.ci-pr-only.result }}
          name: ci-pr-only-status

# Because ci-pr-only is not run on merge groups, always mark the ci-pr-only-status as a success
# This is a hack to get around the fact that status checks are still required for the merge queue, even if the workflow itself is not run
  post-required-check-status-ci-pr-only-merge-queue:
    name: Post Required Check Status Merge Queue
    runs-on: ubuntu-latest
    if: github.event_name == 'merge_group'
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/post-commit-status
        with:
          commit-sha: ${{ github.sha }}
          run-result: 'success'
          name: ci-pr-only-status
