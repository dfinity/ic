# Mirror container images we use from DockerHub to GHCR.
#
# Add image to container-mirror-images.json to mirror it to GHCR.
# Use it within MODULE.bazel after it's mirrored to GHCR.
name: Container Image Mirroring

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/container-mirror.yml'
      - '.github/workflows/container-mirror-images.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  get-images:
    name: Get Image List
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse-images.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read Container Images
        id: parse-images
        run: |
          echo "Reading container-mirror-images.json"
          MATRIX=$(jq -c '.images' .github/workflows/container-mirror-images.json)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  mirror:
    name: Mirror Image
    runs-on: ubuntu-latest
    needs: get-images
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.get-images.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Login to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Crane
        env:
          # Keep CRANE_SHA256 in sync with CRANE_VERSION. It is the sha256 of
          # go-containerregistry_Linux_x86_64.tar.gz listed in the release's
          # checksums.txt, e.g.:
          #   curl -fsSL https://github.com/google/go-containerregistry/releases/download/$CRANE_VERSION/checksums.txt
          CRANE_VERSION: v0.21.9
          CRANE_SHA256: 5c16d8ddb971cb1d5e6ed8b1e743da8224414eeba2c2762d8f1a61b2f095699e
        run: |
          set -euo pipefail
          curl -fsSL -o crane.tar.gz \
            "https://github.com/google/go-containerregistry/releases/download/$CRANE_VERSION/go-containerregistry_Linux_x86_64.tar.gz"
          echo "$CRANE_SHA256  crane.tar.gz" | sha256sum --check --strict -
          tar xzf crane.tar.gz crane
          rm crane.tar.gz
          chmod +x crane
          sudo mv crane /usr/local/bin/crane
          crane version

      - name: Mirror Container
        run: |
          crane copy \
            ${{ matrix.repo }}/${{ matrix.image }}@sha256:${{ matrix.sha256 }} \
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@sha256:${{ matrix.sha256 }}
