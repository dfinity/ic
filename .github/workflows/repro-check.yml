name: Repro check
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      github_sha:
        description: Commit on which the repro check should be run
        required: true
        type: string
  # Used as a reusable workflow within release-testing workflow
  workflow_call:
    inputs:
      github_sha:
        description: Commit on which the repro check should be run
        required: true
        type: string
  pull_request:
    paths:
      - 'ci/container/*'
      - 'ci/scripts/repro-check'
      - '.github/workflows/repro-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  # This job builds the IC-OS images of the commit under verification, i.e. it executes that
  # commit's own ci/container/build-ic.sh. Its token must therefore carry the least possible
  # authority, and in particular not the `actions: write` that release-testing.yml grants itself:
  # a reusable workflow inherits the caller's permissions unless it narrows them here.
  contents: read

jobs:
  repro-check:
    name: Run repro-check for ${{ inputs.github_sha || github.sha }}
    # run on all events except on PRs from forks
    if: |
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      labels: dind-large
    container:
      image: ubuntu:26.04
      options: >-
        -e NODE_NAME --privileged --cgroupns host
    steps:
      - name: Setup podman
        shell: bash
        run: |
          apt-get update
          apt-get -y upgrade
          apt-get -y install curl sudo git podman

          # Create a passwordless sudo rule for the current user (usually root in containers, but safe to include)
          # Required because the repro check uses it.
          echo "ubuntu ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/nopasswd
          chmod 0440 /etc/sudoers.d/nopasswd

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ github.event_name == 'pull_request' }}
        with:
          sparse-checkout: "ci/scripts/repro-check"

      - name: Repro check for PR
        shell: bash
        if: ${{ github.event_name == 'pull_request' }}
        env:
          CI_PROJECT_DIR: ${{ github.workspace }}
        run: |
          # Hermetic python interpreter requires a non-root user to be built.
          set -euo pipefail
          sudo -u ubuntu -- "$CI_PROJECT_DIR"/ci/scripts/repro-check --commit ${{ github.sha }} --dry-run

      - name: Repro check for ${{ inputs.github_sha }}
        shell: bash
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # The attestations REST endpoint the script reads is public; the token only lifts the
          # anonymous rate limit of 60 requests/hour/IP, which runners behind a shared address can
          # exhaust. No new permission is needed for it, and the run does not fail without it: an
          # unreachable or rate-limited API only warns.
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hermetic python interpreter requires a non-root user to be built.
          # sudo resets the environment, so GH_TOKEN has to be preserved explicitly.
          #
          # There is deliberately no way to switch the build-provenance check off from here. A
          # commit whose attestations predate the signer change of #11569 is verified by
          # dispatching this workflow on that commit's own ref: the script is fetched at
          # github.sha, so the dispatched ref brings its own contemporaneous repro-check with it.
          sudo --preserve-env=GH_TOKEN -u ubuntu bash -c '
            curl -fsSL https://raw.githubusercontent.com/dfinity/ic/${{ github.sha }}/ci/scripts/repro-check |
            python3 - -c ${{ inputs.github_sha }}
          '
