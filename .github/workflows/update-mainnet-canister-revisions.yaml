name: Update mainnet canister versions file

# NOTE: The workflow  update-nervous-system-wasms is crucial for keeping the currently deployed canister versions`
# up to date.  SNS Canister release qualification tests (under rs/nervous_system/integration_tests) depend on the
# version of the canister being up to date.  If it is disabled, tests might succeed that ought to fail.  Please do not
# disable without consulting (or minimally informing) the team(s) maintaining the NNS and SNS (currently Governance).

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/update-mainnet-canister-revisions.yaml'

defaults:
  run:
    shell: bash

jobs:
  # IMPORTANT: See note at the top of this file.
  update-nervous-system-wasms:
    # for dfinity/ic: run on all events except on PRs from forks;
    # never run on other repos such as dfinity/ic-private
    if: |
      github.repository == 'dfinity/ic' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on:
      labels: dind-small
    environment: CREATE_PR
    container:
      image: ghcr.io/dfinity/ic-build@sha256:caacdcf7c2346ff8b6d8b86ecfa89b1365fa111f744e0e777ac5bf9a5ca97c61
      options: >-
        -e NODE_NAME --privileged --cgroupns host -v /var/tmp:/var/tmp -v /ceph-s3-info:/ceph-s3-info --mount type=tmpfs,target="/tmp/containers"
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ vars.PR_CREATION_BOT_APP_ID }}
          private-key: ${{ secrets.PR_CREATION_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup gh cli
        env:
          GH_CLI_VERSION: 2.98.0
          # sha256 of gh_${GH_CLI_VERSION}_linux_amd64.tar.gz. When bumping the
          # version, take the new value from that release's
          # gh_${GH_CLI_VERSION}_checksums.txt asset.
          GH_CLI_SHA256: 3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de
        run: |
          set -eEuxo pipefail

          # Without --fail, 4xx and 5xx are considered "success", because UNIX.
          # If this keeps failing, consider applying other --retry-??? flags.
          curl \
            --location https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz \
            --output gh_cli.tar.gz \
            --fail \
            --retry 7

          # Release assets are mutable under an existing tag, so the URL alone is
          # not a trust anchor: verify against the checksum pinned above before
          # unpacking or running anything.
          echo "${GH_CLI_SHA256}  gh_cli.tar.gz" | sha256sum --check

          tar -xvf gh_cli.tar.gz
          mv "gh_${GH_CLI_VERSION}_linux_amd64" gh_cli
          chmod +x ./gh_cli/bin/gh
          sudo cp ./gh_cli/bin/gh /usr/local/bin/
          rm -rf gh_cli*

      - name: Update mainnet canister versions file
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ case(github.event_name == 'pull_request', '--dry-run', '') }}
        run: |
          set -eEuxo pipefail

          # Run mainnet_revisions.py with exponential backoff, because it is
          # sensitive to network issues, which are pretty frequent yet
          # transient.
          retry \
            --times=10 \
            --delay=1,2,4,8,15,30,60,120,300,600 \
            -- time python3 \
            ci/src/mainnet_revisions/mainnet_revisions.py \
            $DRY_RUN \
            canisters
