name: local-system-tests

on:
  schedule:
    - cron: "0 21 * * *" # 21:00 UTC
  workflow_dispatch:

env:
  CI_JOB_NAME: ${{ github.job }}

jobs:
  # The bazel-test-all job of ci-main.yml runs the `_local` system-tests on the Bazel Remote Execution cluster @ Namespace,
  # except for the ones with any of the EXCLUDED_TAGS of ci/scripts/targets.py, like system_test_large. This nightly job
  # runs all `_local` system-tests, those included, on one dind runner. There each test reserves a significant number of
  # the runner's 64 CPUs from Bazel, so the tests spend most of their time waiting for their share, hence the long timeout.
  local-system-tests:
    name: Bazel Test Local System Tests
    runs-on:
      labels: dind-large
    container:
      image: ghcr.io/dfinity/ic-build@sha256:6184a4beddca0e898c9e2113b2dd78f0391caefef7c13090c56ae1ab7b1ec399
      options: >-
         -e NODE_NAME --privileged --cgroupns host --mount type=tmpfs,target="/tmp/containers"
    timeout-minutes: 600
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/netrc
      # GitHub runners override the container's entrypoint which is ci/container/init.sh
      # so we run it explicitly here to ensure the system is set up correctly for running local system-tests.
      - run: ci/container/init.sh
      - name: Run Local System Tests
        uses: ./.github/actions/bazel
        with:
          run: |
            bazel test \
              --config=stamped \
              --config=flaky_retry \
              --test_tag_filters=local_system_test \
              //rs/tests/... \
              --keep_going
          GPG_PASSPHRASE: ${{ secrets.BEP_GPG_PASSPHRASE }}
