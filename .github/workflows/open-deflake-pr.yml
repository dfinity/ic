name: Open Deflake PR

# Opens the fix that fix-flaky-test.yml made for a flaky test as a draft PR authored by claude[bot].
# fix-flaky-test.yml dispatches this as a separate run from master because the claude[bot] token,
# which claude-code-action gets through an OIDC token exchange, requires the running workflow file to
# equal the one on master. To recover from a failed run, dispatch it again with the same inputs while
# the deflake-<slug> artifact of the original run still exists.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The ID of the schedule-fix-flaky-tests.yml run that fixed the test
        required: true
        type: string
      label:
        description: The most flaky label of the test
        required: true
        type: string
      labels:
        description: The space-separated flaky labels of all variants of the test
        required: true
        type: string
      slug:
        description: The base label of the test usable in branch and artifact names
        required: true
        type: string
      base_sha:
        description: The master commit the fix is based on
        required: true
        type: string
      ci_all_bazel_targets:
        description: Whether to open the PR with the CI_ALL_BAZEL_TARGETS label
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ inputs.slug }}

defaults:
  run:
    shell: bash

jobs:
  open:
    name: Open PR
    if: github.repository == 'dfinity/ic' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # for downloading the fix from the other run
      pull-requests: read
      id-token: write # for the claude[bot] token
    env:
      RUN_ID: ${{ inputs.run_id }}
      LABEL: ${{ inputs.label }}
      LABELS: ${{ inputs.labels }}
      SLUG: ${{ inputs.slug }}
      BASE_SHA: ${{ inputs.base_sha }}
      ADD_LABEL: ${{ inputs.ci_all_bazel_targets }}
    steps:
      - name: Validate inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          label_re='^//[A-Za-z0-9_./-]+:[A-Za-z0-9_./+-]+$'
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$LABEL" =~ $label_re ]]
          for label in $LABELS; do
            [[ "$label" =~ $label_re ]]
          done
          [[ "$SLUG" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '"\(.path) \(.head_branch) \(.head_repository.full_name) \(.event)"')"
          [[ "$run" =~ ^\.github/workflows/schedule-fix-flaky-tests\.yml\ master\ $GITHUB_REPOSITORY\ (schedule|workflow_dispatch)$ ]]
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...master" --jq .status)"
          [[ "$status" == identical || "$status" == ahead ]]

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          persist-credentials: false

      - name: Download the fix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deflake-${{ inputs.slug }}
          path: ${{ runner.temp }}/deflake
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Validate the fix
        run: ci/scripts/validate-deflake-bundle.sh

      # The claude[bot] token is in the environment when claude-code-action installs bun and Claude Code, so
      # they are pinned like gh. Bump them with the action, whose action.yml and src/entrypoints/run.ts pin them.
      - name: Install bun and Claude Code
        env:
          BUN_VERSION: 1.3.14
          BUN_SHA256: 951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f
          CLAUDE_CODE_VERSION: 2.1.286
          CLAUDE_CODE_SHA256: fe503f65c6289d59c23e5b21ae44f03583f997dd33a2cbfc75ab4f96fb8fc73f
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --retry 7 --location --output bun.zip \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  bun.zip" | sha256sum --check
          unzip -q bun.zip
          curl --fail --retry 7 --location --output claude \
            "https://downloads.claude.ai/claude-code-releases/${CLAUDE_CODE_VERSION}/linux-x64/claude"
          echo "${CLAUDE_CODE_SHA256}  claude" | sha256sum --check
          chmod +x claude

      - name: Open the PR as claude[bot]
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1.0.238
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          path_to_bun_executable: ${{ runner.temp }}/bun-linux-x64/bun
          path_to_claude_code_executable: ${{ runner.temp }}/claude
          # The actor of runs dispatched with GITHUB_TOKEN.
          allowed_bots: github-actions[bot]
          bot_id: 209825114
          bot_name: claude[bot]
          claude_args: >-
            --model claude-haiku-4-5-20251001
            --max-turns 6
            --setting-sources user
            --permission-mode dontAsk
            --permission-prompts none
            --allowedTools "Bash(bash ci/scripts/open-deflake-pr.sh)"
          settings: |
            {
              "env": {
                "CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1",
                "BASH_DEFAULT_TIMEOUT_MS": "900000",
                "BASH_MAX_TIMEOUT_MS": "900000"
              }
            }
          prompt: Run `bash ci/scripts/open-deflake-pr.sh` once and reply with its last line.

      # The action succeeds without running Claude when the workflow file changed on master.
      - name: Verify the PR
        if: ${{ !cancelled() && steps.claude.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="$(jq -r '.url // empty' "$RUNNER_TEMP/deflake-pr.json" 2>/dev/null || true)"
          if [ -z "$url" ]; then
            echo "No PR was opened for ${BRANCH:-$SLUG}: dispatch this workflow again with the same inputs." >&2
            exit 1
          fi
          pr="$(gh pr view "$url" --json author,isDraft,headRefName --jq '"\(.author.login) \(.isDraft) \(.headRefName)"')"
          if [[ ! "$pr" =~ ^app/claude\ true\ ai/deflake- ]]; then
            echo "$url isn't a draft PR by claude[bot]: $pr" >&2
            exit 1
          fi
          echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
