name: Container IC Build Image

on:
  pull_request:
    paths:
      - '.github/workflows/container-autobuild.yml'
      - 'ci/container/**'
  push:
    branches:
      - 'dev-gh-*'
    paths:
      - '.github/workflows/container-autobuild.yml'
      - 'ci/container/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# This workflow runs from the pull request's own copy of the file and holds no
# secret. When it completes, container-publish.yml, which always runs as
# master's copy, builds and pushes the images if the recipe hash differs from
# ci/container/TAG and commits TAG and the digest pins to the branch.
permissions:
  contents: read

jobs:
  build-image-prep:
    name: Build Image Prep
    runs-on: ubuntu-latest
    outputs:
      build_image: ${{ steps.set-output.outputs.build_image }}
      image_tag: ${{ steps.set-output.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set Build Output
        shell: bash
        id: set-output
        run: |
          # Check if we've previously already built ic-build image
          set -eExuo pipefail
          image_tag="$(ci/container/get-image-tag.sh)"
          if grep $image_tag ci/container/TAG; then
            echo "build_image=false" >> "$GITHUB_OUTPUT"
            echo "Update with this image already in this PR!"
            echo "Modify ci/container/TAG with a random string to trigger a new build."
          else
            echo "build_image=true" >> "$GITHUB_OUTPUT"
            echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
            echo "The Container Publish workflow will build and push the images with tag $image_tag and commit TAG and the digests to this branch."
          fi

