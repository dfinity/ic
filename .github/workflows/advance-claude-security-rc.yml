name: Advance Claude Security RC

# Points the claude-security-rc branch, which the weekly Claude Security scheduled scan
# (claude.ai/security) scans, at every scheduled RC once Release Testing has passed on it.

on:
  workflow_run:
    types:
      - completed
    branches:
      - rc--*
    workflows:
      - Release Testing

permissions: {}

jobs:
  advance-claude-security-rc:
    name: Advance claude-security-rc
    # The workflows and branches filters above match names that a fork PR's run controls,
    # so also require a push run of this repository's own release-testing.yml.
    if: |
      github.repository == 'dfinity/ic' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/release-testing.yml'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Point claude-security-rc at the tested RC
        shell: bash
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$BRANCH" =~ ^rc--[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}$ ]]; then
            echo "$BRANCH is not a scheduled RC cut"
            exit 0
          fi

          TIP="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)"
          if [[ "$TIP" != "$SHA" ]]; then
            echo "$BRANCH points at $TIP, not at the tested $SHA"
            exit 1
          fi

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/claude-security-rc" \
            -f sha="$SHA" -F force=true --silent \
            || gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/heads/claude-security-rc -f sha="$SHA" --silent
          echo "claude-security-rc -> $BRANCH ($SHA)" | tee -a "$GITHUB_STEP_SUMMARY"
