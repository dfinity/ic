name: Advance Claude Security RC

# Points the claude-security-rc branch, which the weekly Claude Security scheduled scan
# (claude.ai/security) scans, at Thursday's RC once Release Testing has passed on it.

on:
  workflow_run:
    types:
      - completed
    branches:
      - rc--*
    workflows:
      - Release Testing

permissions: {}

concurrency:
  group: advance-claude-security-rc
  cancel-in-progress: false

jobs:
  advance-claude-security-rc:
    name: Advance claude-security-rc
    if: github.repository == 'dfinity/ic' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Point claude-security-rc at Thursday's RC
        shell: bash
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rc_regex='^rc--([0-9]{4}-[0-9]{2}-[0-9]{2})_[0-9]{2}-[0-9]{2}$'
          if [[ ! "$BRANCH" =~ $rc_regex ]]; then
            echo "$BRANCH is not a scheduled RC cut"
            exit 0
          fi
          day="${BASH_REMATCH[1]}"

          # The most recent Thursday (4 in `date +%u`), today included, so that the
          # branch only moves forward, to this week's RC.
          thursday="$(date -u -d "$((($(date -u +%u) - 4 + 7) % 7)) days ago" +%F)"
          if [ "$day" != "$thursday" ]; then
            echo "$BRANCH was not cut on the most recent Thursday ($thursday)"
            exit 0
          fi

          newest="$(git ls-remote --heads "https://github.com/$GITHUB_REPOSITORY" "refs/heads/rc--${day}_*" \
            | awk '{print $2}' | sed 's#^refs/heads/##' | grep -E "$rc_regex" | sort | tail -n 1)"
          if [ "$BRANCH" != "$newest" ]; then
            echo "$BRANCH was superseded by $newest"
            exit 0
          fi

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/claude-security-rc" \
            -f sha="$SHA" -F force=true --silent \
            || gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/heads/claude-security-rc -f sha="$SHA" --silent
          echo "claude-security-rc -> $BRANCH ($SHA)" | tee -a "$GITHUB_STEP_SUMMARY"
