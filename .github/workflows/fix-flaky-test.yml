name: Fix Flaky Test

# Called by schedule-fix-flaky-tests.yml for each flaky test. Claude only commits the fix locally:
# open-deflake-pr.yml opens it as a PR in a separate run (see there). Claude has DEADLINE_MINUTES to return its
# result, which ci/scripts/deflake-deadline-hook.sh enforces.

on:
  workflow_call:
    inputs:
      label:
        description: The most flaky label of the test
        required: true
        type: string
      labels:
        description: The space-separated flaky labels of all variants of the test
        required: true
        type: string
      base:
        description: The label of the test without its variant suffix
        required: true
        type: string
      slug:
        description: The base label usable in branch and artifact names
        required: true
        type: string
      ci_all_bazel_targets:
        description: Whether to open the PR with the CI_ALL_BAZEL_TARGETS label
        required: true
        type: boolean
      dry_run:
        description: Fix the test but don't open a PR
        required: true
        type: boolean
    secrets:
      ANTHROPIC_API_KEY:
        required: true

defaults:
  run:
    shell: bash

env:
  CI_JOB_NAME: ${{ github.job }}

jobs:
  fix:
    name: Fix
    runs-on:
      labels: dind-large
    container:
      image: ghcr.io/dfinity/ic-build@sha256:0b6a915e614105c632a0c7a0f6e530ed506decfbd0316b297b28e9c555c532a2
      options: >-
        -e NODE_NAME --privileged --cgroupns host --mount type=tmpfs,target="/tmp/containers"
    timeout-minutes: 240
    # Only runs on master get the ANTHROPIC_API_KEY secret of this environment. The job deploys nothing, so it
    # records no deployment.
    environment:
      name: fix-flaky-tests
      deployment: false
    permissions:
      contents: read
      actions: read # for downloading the logs of RBE tests
      pull-requests: read
    outputs:
      status: ${{ steps.package.outputs.status }}
      base_sha: ${{ steps.base.outputs.sha }}
    env:
      GIT_TERMINAL_PROMPT: 0
      GH_PROMPT_DISABLED: 1
      # Claude's share of timeout-minutes: one attempt at the slowest test that flaked in a month (36 minutes p90,
      # three runs) takes 140-175 minutes including the log download, the analysis and the Rust checks. The other 40
      # minutes cover a cold checkout (up to 15 minutes), the result after the hook starts denying, and the packaging.
      DEADLINE_MINUTES: 200
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          fetch-depth: 0

      - name: Record the base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/netrc

      # GitHub runners override the container's entrypoint which is ci/container/init.sh
      # so we run it explicitly here to ensure the system is set up correctly for running local system-tests.
      - run: ci/container/init.sh

      - name: Setup gh cli
        # Same step as in update-mainnet-canister-revisions.yaml.
        env:
          GH_CLI_VERSION: 2.98.0
          # sha256 of gh_${GH_CLI_VERSION}_linux_amd64.tar.gz. When bumping the
          # version, take the new value from that release's
          # gh_${GH_CLI_VERSION}_checksums.txt asset.
          GH_CLI_SHA256: 3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de
        run: |
          set -eEuxo pipefail

          # Without --fail, 4xx and 5xx are considered "success", because UNIX.
          # If this keeps failing, consider applying other --retry-??? flags.
          curl \
            --location https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz \
            --output gh_cli.tar.gz \
            --fail \
            --retry 7

          # Release assets are mutable under an existing tag, so the URL alone is
          # not a trust anchor: verify against the checksum pinned above before
          # unpacking or running anything.
          echo "${GH_CLI_SHA256}  gh_cli.tar.gz" | sha256sum --check

          tar -xvf gh_cli.tar.gz
          mv "gh_${GH_CLI_VERSION}_linux_amd64" gh_cli
          chmod +x ./gh_cli/bin/gh
          sudo cp ./gh_cli/bin/gh /usr/local/bin/
          rm -rf gh_cli*

      # Anyone can open a PR from a fork or comment on a PR, so Claude only gets to read the PRs
      # and comments of trusted authors, collected here.
      - name: Collect related PRs
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ inputs.base }}
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          since="$(date -u -d '30 days ago' +%F)"
          name="${BASE##*:}"
          fields=number,title,state,isDraft,isCrossRepository,author,headRefName,updatedAt,closedAt,mergedAt,url,body,files,reviews,comments
          words="\"${name//_/ }\""
          package="${BASE#//}"
          package="${package%%:*}/"
          # gh only lists the first 100 files of a PR, so the files of bigger ones are listed page by page.
          touching="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,isCrossRepository,updatedAt,changedFiles,files \
            | jq -r --arg package "$package" --arg since "$since" \
              '.[] | select((.isCrossRepository | not) and .updatedAt >= $since)
                | if any(.files[].path; startswith($package)) then "\(.number) yes" elif .changedFiles > (.files | length) then "\(.number) maybe" else empty end' \
            | while read -r number touches; do
                if [ "$touches" == maybe ] && files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$number/files?per_page=100")" \
                  && ! jq -e -s --arg package "$package" 'add | any(.[].filename; startswith($package))' <<<"$files" >/dev/null; then
                  continue
                fi
                echo "$number"
              done)"
          # Open PRs about the test or touching its package, and closed deflake PRs: those of this test at any age,
          # so that a rejected fix isn't proposed again. `head:` matches the branches that start with its value.
          prs="$({
            for search in "deflake in:title" "$words in:title" "head:ai/deflake-$SLUG-"; do
              gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 500 --search "$search" --json "$fields"
            done
            for number in $touching; do
              gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json "$fields" --jq '[.]'
            done
            for search in "deflake in:title closed:>=$since" "$words deflake in:title" "head:ai/deflake-$SLUG-"; do
              gh pr list --repo "$GITHUB_REPOSITORY" --state closed --limit 500 --search "$search" --json "$fields"
            done
          } | jq -s 'add | unique_by(.number) | map(select(.isCrossRepository | not))')"
          # authorAssociation hides private org membership from this token, so authors are trusted by permission:
          # anyone who can read the repository can open a PR from one of its branches. The permission field
          # reports maintainers as write.
          trusted="$(jq -r '[.[] | .author, (.reviews + .comments)[].author | .login] | unique[]' <<<"$prs" | while read -r login; do
            permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$login/permission" --jq .permission 2>/dev/null || true)"
            if [[ "$permission" == admin || "$permission" == write || "$login" == copilot-pull-request-reviewer ]]; then
              echo "$login"
            fi
          done | jq -R . | jq -s -c .)"
          jq --argjson trusted "$trusted" '
            def trusted: .author.login | IN($trusted[]);
            map(
              # The files of untrusted PRs are kept to avoid conflicts. claude[bot] opens PRs for people with write
              # access, but what an earlier Claude run wrote is not passed on to the next one.
              (if trusted then . elif .author.login == "app/claude" then del(.body) else del(.title, .body) end)
              | .author = .author.login
              | .files |= map(.path)
              | .reviews |= map(select(trusted) | {author: .author.login, state, body})
              | .comments |= map(select(trusted) | {author: .author.login, body})
            )' <<<"$prs" > "$RUNNER_TEMP/deflake-context.json"
          jq -r '.[] | "#\(.number) \(.state) \(.title // "(untrusted author)")"' "$RUNNER_TEMP/deflake-context.json"
          echo "Trusted the PRs, reviews and comments of: $(jq -r 'join(", ")' <<<"$trusted")"

      # Claude must return its result before the deadline, which the prompt states and the hook enforces: it denies
      # every tool call after the deadline and cuts the timeout of each command to the time left. The hook and its
      # configuration are installed as root, in the managed settings, because the hooks in Claude's own
      # ~/.claude/settings.json reload on change. The job's timeout-minutes is the backstop.
      - name: Set the deadline
        id: deadline
        run: |
          set -euo pipefail
          deadline=$(($(date +%s) + DEADLINE_MINUTES * 60))
          echo "epoch=$deadline" >> "$GITHUB_OUTPUT"
          echo "utc=$(date -u -d "@$deadline" '+%F %T')" >> "$GITHUB_OUTPUT"
          sudo install -m 755 ci/scripts/deflake-deadline-hook.sh /usr/local/bin/deflake-deadline-hook
          settings="$(mktemp)"
          jq -n --arg command "/usr/local/bin/deflake-deadline-hook $deadline" \
            '{hooks: {PreToolUse: [{hooks: [{type: "command", $command}]}]}}' > "$settings"
          sudo install -D -m 644 "$settings" /etc/claude-code/managed-settings.json
          # A hook that fails to run lets the call through, so it is checked here.
          input='{"tool_name":"Bash","tool_input":{"command":"true"}}'
          rc=0
          deflake-deadline-hook 0 <<<"$input" 2>/dev/null || rc=$?
          [ "$rc" -eq 2 ]
          deflake-deadline-hook "$deadline" <<<"$input" \
            | jq -e '.hookSpecificOutput.updatedInput | .command == "true" and (.timeout | type == "number")' >/dev/null

      # With sudo Claude would be root in this privileged container on a shared runner.
      - name: Drop sudo
        run: |
          sudo sed -i '/^ALL ALL=(ALL) NOPASSWD: ALL$/d' /etc/sudoers
          if sudo -n -l >/dev/null 2>&1; then
            echo "sudo still allows commands:" >&2
            sudo -n -l >&2
            exit 1
          fi

      - name: Fix the flaky test
        id: claude
        uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1.0.238
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Read-only, so that no token in this job can push or open PRs.
          github_token: ${{ github.token }}
          # claude-code-action refuses bot actors, and the merge queue is the actor of scheduled runs
          # because it pushed the cron schedule to master.
          allowed_bots: github-merge-queue[bot]
          bot_id: 209825114
          bot_name: claude[bot]
          # The action stops at the first result message, so nothing may finish in a later turn: the tools that
          # defer work are denied and background tasks and cron disabled. The fix doesn't need the web.
          claude_args: >-
            --model claude-opus-5-5
            --effort max
            --permission-mode bypassPermissions
            --permission-prompts none
            --disallowedTools Workflow,Monitor,SendMessage,CronCreate,ScheduleWakeup,EnterPlanMode,WebFetch,WebSearch
            --json-schema '{"type":"object","properties":{"status":{"type":"string","enum":["fixed","skipped","no_logs","not_reproducible","needs_human","failed"]},"reason":{"type":"string"},"pr_body":{"type":"string"}},"required":["status","reason"]}'
          settings: |
            {
              "env": {
                "CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1",
                "CLAUDE_CODE_DISABLE_CRON": "1",
                "BASH_DEFAULT_TIMEOUT_MS": "7200000",
                "BASH_MAX_TIMEOUT_MS": "7200000",
                "CLAUDE_CODE_RETRY_WATCHDOG": "1"
              }
            }
          prompt: |
            You run unattended in a GitHub Actions job of dfinity/ic (self-hosted dind-large runner, ic-build
            container, ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            Nobody can answer questions: decide yourself, or stop and report.

            Return your result before ${{ steps.deadline.outputs.utc }} UTC, ${{ env.DEADLINE_MINUTES }} minutes from
            now (`date -u` shows the time). After that a hook denies every tool call, also in subagents, and until
            then it cuts the timeout of each command to the time left. Reruns can't reproduce a flake seen once in
            dozens of runs or refute a fix for it: find the cause in the logs and the code, run step 6 once, and
            again only if the fix changed. The logs of step 2 show how long a run takes, so start the last one in
            time. If the fix can't be verified before the deadline, stop with status "needs_human" and report what
            you found, what you tried and what is left to do.

            Fix the flaky test ${{ inputs.label }} by following the fix-flaky-tests skill
            (.claude/skills/fix-flaky-tests/SKILL.md), starting at step 2 of "Fix a flaky test". These variants of
            the same test (same test binary) all flaked recently: ${{ inputs.labels }}.
            Fix ONE root cause.

            First check whether the test is already fixed or being fixed, like step 1.2 of the skill, but unlike
            step 1.2 a mere mention is not enough. Stop with status "skipped", naming the PR or commit, if:
            - $RUNNER_TEMP/deflake-context.json lists an open PR that fixes the flakiness of this test, or an open
              PR updated in the last 30 days that modifies its source files (to avoid conflicts; the file has all
              such PRs that touch its package).
            - A PR merged or a commit made in the last week addressed its flakiness, even if it leaves a cause for
              later (its author may be on it, and new flaky runs will show what is left). Find it in that file and
              with `git log --since='1 week ago' -i -E --grep '<test name with _ replaced by [_. ]>'` and
              `git log --since='1 week ago' -- <the source files of the test>`. It counts if
              `bazel run //ci/githubstats:query -- last --flaky --since <its commit> --skip-download <label>`
              shows no flaky run since then for any of the flaky labels. A reverted fix doesn't count.
            If a deflake PR for this test was closed without being merged, don't propose its rejected fix again.
            Read PRs and comments only from that file: don't read other PR, issue or comment text with gh.
            Only count flaky runs on master, in the merge queue, or on PRs that don't change this test.

            Deviations from the skill in this environment:
            - Skip the "Prerequisites": master is checked out at ${{ steps.base.outputs.sha }} with its full history,
              and gh uses the read-only GH_TOKEN. Never run `gh auth login`, never change the git remotes, and
              never pull or rebase.
            - In step 2 run the command of the skill for each label (Farm labels with --download-ic-logs
              --download-console-logs, *_local labels without) and read each LOG_DIR/README.md.
              If none of the flaky runs has logs, stop with status "no_logs".
            - Run bazel, cargo and ./ci/scripts/rust-lint.sh in the foreground, one at a time, from the main agent.
              Only use subagents for read-only analysis.
            - Every `bazel test` that includes a *_local target uses --local_test_jobs=2 since the runner only has
              64 CPUs. Otherwise use --local_test_jobs=3 instead of --jobs=3. In step 6 verify every label whose
              flakiness the fix addresses. For system-tests these runs also satisfy the test step of
              .claude/CLAUDE.md: only build the other system-tests its rdeps query returns.
            - Only change files under rs/, packages/ or ic-os/, but no *.bzl files, nothing under
              rs/ic_os/config/types/, no symlinks or binary files, and at most 1000 changed lines in at most 10
              commits. In Cargo.toml files only add or remove dependencies as `name = { workspace = true }`, and
              change the root Cargo.lock only accordingly. Don't change other dependency or toolchain configuration,
              like .cargo/config or requirements.txt files. If the fix needs anything else, stop with status
              "needs_human" and explain why.
            - In step 7 commit the fix on a local branch named `deflake`. Don't push and don't open a PR: a later
              workflow does that. Instead return the PR description as pr_body: the root cause analysis, the
              verification results and all flaky labels.
            - The reason and pr_body are published in this public repository: don't include raw log lines or
              internal hostnames, URLs or IP addresses. pr_body shows HTML, character references, links, images,
              footnotes, tables, mentions and the languages of code blocks as plain text and $ in code as &#36;,
              so write plain Markdown with bare URLs, and lists instead of tables.

      - name: Report
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          if [ -f "$EXECUTION_FILE" ]; then
            jq -r '
              (map(select(.type == "system" and .subtype == "init")) | first // {}) as $init
              | (map(select(.type == "result")) | first // {}) as $r
              | "model: \($init.model)",
                "permission mode: \($init.permissionMode)",
                "Claude Code: \($init.claude_code_version)",
                "result: \($r.subtype) is_error=\($r.is_error) turns=\($r.num_turns) terminal_reason=\($r.terminal_reason)",
                "background tasks: \(map(select(.type == "system" and ((.subtype == "task_started" and .is_backgrounded != false and .ambient != true) or (.subtype == "task_updated" and .patch.is_backgrounded == true)))) | length)"
              ' "$EXECUTION_FILE"
          fi

      # Only early feedback: Claude could have tampered with this job, so open-deflake-pr.yml checks again.
      - name: Package
        id: package
        if: always()
        env:
          RESULT: ${{ steps.claude.outputs.structured_output }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          DEADLINE: ${{ steps.deadline.outputs.epoch }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          LABELS: ${{ inputs.labels }}
          SLUG: ${{ inputs.slug }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # Claude shares this HOME, so start from scratch.
          rm -rf ~/deflake ~/deflake-result
          status=failed
          reason="Claude returned no result"
          # The action sets no structured_output when the result isn't a success, like after a connection drop that
          # followed the StructuredOutput call (Claude Code 2.1.290 fixes that), so it is also read from the result
          # message in the execution file. So is the text of a final turn that didn't call StructuredOutput.
          result='{}'
          [ ! -f "$EXECUTION_FILE" ] || result="$(jq -c 'map(select(.type == "result")) | first // {}' "$EXECUTION_FILE")"
          [ -n "$RESULT" ] || RESULT="$(jq -c '.structured_output // empty' <<<"$result")"
          if [ -n "$RESULT" ] && jq -e '.status | IN("fixed", "skipped", "no_logs", "not_reproducible", "needs_human", "failed")' <<<"$RESULT" >/dev/null; then
            status="$(jq -r .status <<<"$RESULT")"
            reason="$(jq -r .reason <<<"$RESULT")"
          else
            text="$(jq -r '.result | strings' <<<"$result")"
            [ -z "$text" ] || reason="$text"
            # The hook makes Claude report before the deadline, so past it the time ran out and the test needs a
            # human, like after any attempt that ended without a fix (find-flaky-tests.sh doesn't retry those for a
            # week). Before it the job broke, and the test is retried.
            [ "$(date +%s)" -lt "$DEADLINE" ] || status=needs_human
          fi
          if [ "$status" == fixed ]; then
            if ! git rev-parse --verify --quiet refs/heads/deflake >/dev/null \
              || ! git merge-base --is-ancestor "$BASE_SHA" refs/heads/deflake \
              || [ "$(git rev-list --count "$BASE_SHA..refs/heads/deflake")" -lt 1 ] \
              || [ "$(git rev-list --count "$BASE_SHA..refs/heads/deflake")" -gt 10 ]; then
              status=failed
              reason="the fix isn't 1 to 10 commits on branch deflake on top of $BASE_SHA"
            elif ! jq -e '.pr_body | strings | test("\\S")' <<<"$RESULT" >/dev/null; then
              status=failed
              reason="Claude fixed the test but returned no PR description"
            elif uncommitted="$(git status --porcelain)" && [ -n "$uncommitted" ]; then
              # The bundle only has what's committed, which then isn't all that was verified.
              status=failed
              reason="the fix has uncommitted changes: $(head -5 <<<"$uncommitted" | tr '\n' ' ')"
            elif [ "$DRY_RUN" != true ]; then
              mkdir -p ~/deflake
              # Only the final tree is bundled, so that the public artifact doesn't carry the commits leading to it.
              squashed="$(git -c user.name='claude[bot]' -c user.email='209825114+claude[bot]@users.noreply.github.com' \
                commit-tree 'refs/heads/deflake^{tree}' -p "$BASE_SHA" -m 'fix: deflake')"
              git update-ref refs/heads/deflake "$squashed"
              git bundle create ~/deflake/deflake.bundle refs/heads/deflake ^"$BASE_SHA"
              jq -r .pr_body <<<"$RESULT" > ~/deflake/body.md
            fi
          fi
          mkdir -p ~/deflake-result
          # Up to 10 000 characters: a time-boxed attempt hands its findings over here.
          reason="$(jq -rn --arg reason "$reason" '$reason[:10000]')"
          jq -n --arg slug "$SLUG" --arg labels "$LABELS" --arg status "$status" --arg reason "$reason" \
            '{$slug, $labels, $status, $reason}' > ~/deflake-result/"result-$SLUG.json"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          printf '**%s**\n\n```\n%s\n```\n' "$status" "$(tr -d '`\r' <<<"$reason")" >> "$GITHUB_STEP_SUMMARY"

      # Not only on success: a fix that Package read from the execution file after the action failed counts too.
      - name: Upload the fix
        if: "!cancelled() && steps.package.outputs.status == 'fixed' && !inputs.dry_run"
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: deflake-${{ inputs.slug }}
          # (${{ runner.temp }} is not used since it expands to the host path.)
          path: ~/deflake
          retention-days: 3

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: deflake-result-${{ inputs.slug }}
          path: ~/deflake-result
          # Also the memory of find-flaky-tests.sh: an attempt that ended as not_reproducible or needs_human isn't
          # repeated while its result exists.
          retention-days: 7

  request-pr:
    name: Request PR
    needs: fix
    if: "!cancelled() && needs.fix.outputs.status == 'fixed' && !inputs.dry_run"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # for dispatching open-deflake-pr.yml
    steps:
      # A separate run, because the claude[bot] token that open-deflake-pr.yml gets requires the
      # running workflow file to equal the one on master, which may have changed since this run started.
      - name: Dispatch open-deflake-pr.yml
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ inputs.label }}
          LABELS: ${{ inputs.labels }}
          SLUG: ${{ inputs.slug }}
          BASE_SHA: ${{ needs.fix.outputs.base_sha }}
          CI_ALL_BAZEL_TARGETS: ${{ inputs.ci_all_bazel_targets }}
        run: |
          gh workflow run open-deflake-pr.yml --repo "$GITHUB_REPOSITORY" --ref master \
            -f run_id="$GITHUB_RUN_ID" \
            -f label="$LABEL" \
            -f labels="$LABELS" \
            -f slug="$SLUG" \
            -f base_sha="$BASE_SHA" \
            -f ci_all_bazel_targets="$CI_ALL_BAZEL_TARGETS"
