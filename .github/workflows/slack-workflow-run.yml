name: Slack Workflow Run

on:
  workflow_run:
    types:
      - completed
    branches:
      - master
      - rc--*
      - hotfix-*
      - ic-mainnet-revisions
      - ic-nervous-system-wasms
    workflows:
      - Schedule Daily
      - Schedule RC
      - Schedule Rust Benchmarks
      - Release Testing
      - Publish Release
      - Container IC Base Images
      - PocketIC Windows
      - Sync IC private from IC public
      - Update mainnet ICOS versions file
      - Update mainnet canister versions file
      - Kickoff
      - Bazel Dependency Submission
      - Advance Claude Security RC

jobs:
  slack-workflow-run:
    name: Send Notification
    # Skip runs from forks, whose workflow and branch names can match the filters above.
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Setup Message and Channels
        id: setup
        shell: bash
        run: |
          CHANNEL="eng-idx-alerts"
          FULL_MESSAGE="nothing"

          # if a job was cancelled, never post it to slack
          if [[ "$TRIGGERING_WORKFLOW_CONCLUSION" =~ ^(cancelled)$ ]]; then
            POST_TO_SLACK="false"
            echo "post_to_slack=${POST_TO_SLACK}" >> $GITHUB_OUTPUT
            exit 0
          # if a job was successful, don't post it to slack, unless it was a release testing job (see below)
          elif [[ "$TRIGGERING_WORKFLOW_CONCLUSION" =~ ^(success)$ ]]; then
            FULL_MESSAGE=":white_check_mark: ${MESSAGE} :relaxed:"
            POST_TO_SLACK="false"
          # if a job failed or timed out, always post it to slack
          elif [[ "$TRIGGERING_WORKFLOW_CONCLUSION" =~ ^(failure|timed_out)$ ]]; then
            FULL_MESSAGE=":fire: ${MESSAGE} :disappointed:"
            POST_TO_SLACK="true"
          fi

          # If the job was release testing, modify the message and channel and post it to slack
          if [[ "$TRIGGERING_WORKFLOW_NAME" == "Release Testing" ]]; then
            CHANNEL="release-management-alerts"
            COMMIT="$TRIGGERING_WORKFLOW_SHA"
            FULL_MESSAGE="${FULL_MESSAGE} commit: ${COMMIT}"
            POST_TO_SLACK="true"
          fi

          # Non-IDX alerts
          if [[ "$TRIGGERING_WORKFLOW_NAME" == "Schedule Rust Benchmarks" ]]; then
            CHANNEL="eng-crypto-alerts"
          elif [[ "$TRIGGERING_WORKFLOW_NAME" == "Update mainnet ICOS versions file" ]]; then
            CHANNEL="eng-consensus-alerts"
          elif [[ "$TRIGGERING_WORKFLOW_NAME" == "Update mainnet canister versions file" ]]; then
            CHANNEL="eng-nns-alerts"
          elif [[ "$TRIGGERING_WORKFLOW_NAME" == "Kickoff" ]] && [[ "$TRIGGERING_WORKFLOW_BRANCH" == "ic-mainnet-revisions" ]]; then
            CHANNEL="eng-consensus-alerts"
          elif [[ "$TRIGGERING_WORKFLOW_NAME" == "Kickoff" ]] && [[ "$TRIGGERING_WORKFLOW_BRANCH" == "ic-nervous-system-wasms" ]]; then
            CHANNEL="eng-nns-alerts"
          fi

          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT
          echo "message=${FULL_MESSAGE}" >> $GITHUB_OUTPUT
          echo "post_to_slack=${POST_TO_SLACK}" >> $GITHUB_OUTPUT
        env:
          TRIGGERING_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          TRIGGERING_WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGERING_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGERING_WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          MESSAGE: "*${{github.event.workflow_run.name}}* ${{github.event.workflow_run.conclusion}} on ${{github.event.workflow_run.head_branch}} - <${{github.server_url}}/${{github.repository}}/actions/runs/${{github.event.workflow_run.id}}|Run#${{github.event.workflow_run.id}}>"

      - name: Post Slack Notification
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001 # v1.25.0
        if: ${{ steps.setup.outputs.post_to_slack == 'true' }}
        with:
          channel-id: ${{ steps.setup.outputs.channel }}
          slack-message: "${{ steps.setup.outputs.message }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_API_TOKEN }}

      # Release Testing results also go to the release-management-alerts channel on
      # Open Messaging, whose incoming webhooks accept Slack's webhook payload. Links,
      # mrkdwn and the colour bar render only inside an attachment, so the message is
      # sent as one. This post runs even if the Slack post failed, and its own failure
      # does not fail the job.
      - name: Post Open Messaging Notification
        if: ${{ !cancelled() && steps.setup.outputs.post_to_slack == 'true' && github.event.workflow_run.name == 'Release Testing' }}
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: |
          if [[ -z "$OPEN_MESSAGING_WEBHOOK_URL" ]]; then
            echo "The OPEN_MESSAGING_WEBHOOK_RELEASE_MANAGEMENT secret is not set; skipping."
            exit 0
          fi

          if [[ "$CONCLUSION" == "success" ]]; then
            COLOR="good"
          else
            COLOR="danger"
          fi

          PAYLOAD="$(jq --null-input \
            --arg color "$COLOR" \
            --arg title "$WORKFLOW_NAME $CONCLUSION on $BRANCH" \
            --arg title_link "$RUN_URL" \
            --arg text "commit: \`$SHA\`" \
            '{attachments: [{color: $color, title: $title, title_link: $title_link, text: $text}]}')"

          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(curl --silent --show-error --max-time 30 --retry 2 \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            --url "$OPEN_MESSAGING_WEBHOOK_URL")"
          RESPONSE="$(head -c 500 "$RESPONSE_FILE")"
          if [[ "$HTTP_CODE" != "200" || "$RESPONSE" != "ok" ]]; then
            echo "::error::Open Messaging webhook answered HTTP ${HTTP_CODE}: ${RESPONSE}"
            exit 1
          fi
          echo "Posted to Open Messaging."
        env:
          OPEN_MESSAGING_WEBHOOK_URL: ${{ secrets.OPEN_MESSAGING_WEBHOOK_RELEASE_MANAGEMENT }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
