name: CI Main

on:
  workflow_call:
    inputs:
      commit-sha:
        description: The commit sha to run the CI on
        required: true
        type: string
      release-build:
        description: Whether this CI run is for a release build, which may require additional steps such as uploading artifacts.
        required: false
        default: ''
        type: string
    outputs:
      release-build:
        description: Whether this run was a release build, i.e. uploaded artifacts to the CDN.
        value: ${{ jobs.config.outputs.release-build }}
      manifest-sha256:
        description: sha256 of the upload-manifest.
        value: ${{ jobs.upload-manifests.outputs.manifest-sha256 }}

permissions:
  actions: write # needed for uploading artifacts to github
  contents: read
  id-token: write
  pull-requests: read

env:
  CI_COMMIT_SHA: ${{ inputs.commit-sha }}
  CI_JOB_NAME: ${{ github.job }}
  CI_PROJECT_DIR: ${{ github.workspace }}
  CI_EVENT_NAME: ${{ github.event_name }}
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  CI_RUN_ID: ${{ github.run_id }}

jobs:
  bazel-run-fuzzers:
    name: Bazel Run Fuzzers
    runs-on: &dind-large-setup
      labels: dind-large
    container: &container-setup
      image: ghcr.io/dfinity/ic-build@sha256:caacdcf7c2346ff8b6d8b86ecfa89b1365fa111f744e0e777ac5bf9a5ca97c61
      options: >-
         -e NODE_NAME --privileged --cgroupns host --mount type=tmpfs,target="/tmp/containers"
    timeout-minutes: 90
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ case(github.event_name == 'pull_request', 256, 0) }}
          ref: ${{ inputs.commit-sha }}
      - name: Filter fuzzer related files
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        if: github.event_name == 'pull_request'
        id: filter
        with:
          ref: ${{ inputs.commit-sha }}
          filters: |
            fuzzers:
              - ".github/workflows/ci-main.yml"
              - "ci/container/TAG"
              - "ci/container/ic-build.digest"
              - "ci/container/ic-dev.digest"
              - "bin/fuzzing/*.sh"
              - "**/BUILD.bazel"
              - "**/*.bzl"
              - "**/*.rs"
      - uses: ./.github/actions/netrc
        if: github.event_name != 'pull_request' || steps.filter.outputs.fuzzers == 'true'
      - name: Run Libfuzzer targets
        uses: ./.github/actions/bazel
        if: github.event_name != 'pull_request' || steps.filter.outputs.fuzzers == 'true'
        with:
          invocation-names: libfuzzer
          run: ./bin/fuzzing/run-all-fuzzers.sh --libfuzzer 100
      - name: Run AFL targets
        uses: ./.github/actions/bazel
        if: github.event_name != 'pull_request' || steps.filter.outputs.fuzzers == 'true'
        with:
          invocation-names: afl
          run: ./bin/fuzzing/run-all-fuzzers.sh --afl 10

  config:
    name: Set Config
    runs-on: ubuntu-latest
    outputs:
      release-build: ${{ steps.config.outputs.release-build }}
      diff-only: ${{ steps.config.outputs.diff-only }}
      skip_long_tests: ${{ steps.config.outputs.skip_long_tests }}
      skip_buf_checks: ${{ steps.config.outputs.skip_buf_checks }}
    steps:
      - name: Infer build config
        id: config
        run: |
          set -euo pipefail

          # List of "protected" branches, i.e. branches (not necessarily "protected" in the GitHub sense) where we need
          # the full build to occur (including versioning)
          protected_branches=("^master$" "^rc--" "^hotfix-")
          for pattern in "${protected_branches[@]}"; do
              if [[ "$BRANCH_NAME" =~ $pattern ]]; then
                  is_protected_branch="true"
                  break
              fi
          done

          if [[ "${is_protected_branch:-}" == "true" ]]; then
              # if we are on a "protected" branch, targeting an rc branch or master we
              # upload all artifacts and run a release build (with versioning)
              release_build="true"
              diff_only="false"
              skip_long_tests="false"
          elif [[ '${{ github.event_name }}' == "merge_group" ]]; then
              # on a merge group, we don't upload the artifacts (i.e. no release
              # build) but we ensure all targets are built (no diff)
              release_build="false"
              diff_only="false"
              skip_long_tests="true"
          elif [[ '${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'CI_ALL_BAZEL_TARGETS') }}' == 'true' ]]; then
              # "CI_ALL_BAZEL_TARGETS" is set and act as if we're on a protected
              # branch
              release_build="false"
              diff_only="false"
              skip_long_tests="false"
          elif [[ '${{ github.event_name == 'push' }}' == 'true' && "$BRANCH_NAME" =~ '^dev-gh-' ]]; then
              # On pushes to dev-gh-* branches don't do a release, build all targets except long_tests.
              release_build="false"
              diff_only="false"
              skip_long_tests="true"
          elif [[ '${{ github.event_name }}' == "workflow_dispatch" ]]; then
              # if a workflow is manually dispatched, we cannot easily find the file changes, therefore build all targets
              release_build="false"
              diff_only="false"
              skip_long_tests="false"
          else
              # default behavior is to not release, only build targets with modified inputs and skip long_tests.
              release_build="false"

              # The `infer-bazel-targets` job below is very unstable when diff_only is enabled so we temporarily disable it until we have a proper fix.
              # When diff_only is enabled ci/scripts/targets.py will run a bazel query involving `rdeps` of modified files which will force all bazel repositories to be downloaded.
              # These include several multi-GB mainnet ICOS images which will either cause the runner to run out of disk space or the bazel query to run for a very long time or timeout.
              # diff_only="true"
              diff_only="false"

              skip_long_tests="true"
          fi

          # if release build was set, override whatever was determined above
          if [[ '${{ inputs.release-build }}' != '' ]]; then
              release_build=${{ inputs.release-build }}
          fi

          if [[ '${{ contains(github.event.pull_request.labels.*.name, 'CI_OVERRIDE_BUF_BREAKING') }}' == 'true' ]]; then
              skip_buf_checks="true"
          else
              skip_buf_checks="false"
          fi

          echo "| config | value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"

          echo "release-build: $release_build"
          echo "release-build=$release_build" >> "$GITHUB_OUTPUT"
          echo "| \`release-build\` | \`$release_build\` |" >> "$GITHUB_STEP_SUMMARY"

          echo "diff-only: $diff_only"
          echo "diff-only=$diff_only" >> "$GITHUB_OUTPUT"
          echo "| \`diff-only\` | \`$diff_only\` |" >> "$GITHUB_STEP_SUMMARY"

          echo "skip_long_tests: $skip_long_tests"
          echo "skip_long_tests=$skip_long_tests" >> "$GITHUB_OUTPUT"
          echo "| \`skip_long_tests\` | \`$skip_long_tests\` |" >> "$GITHUB_STEP_SUMMARY"

          echo "skip_buf_checks: $skip_buf_checks"
          echo "skip_buf_checks=$skip_buf_checks" >> "$GITHUB_OUTPUT"
          echo "| \`skip_buf_checks\` | \`$skip_buf_checks\` |" >> "$GITHUB_STEP_SUMMARY"

  infer-bazel-targets:
    name: Infer Bazel Targets
    runs-on: ubuntu-latest
    needs: [config]
    steps:
      # calculate which bazel targets may need to be rebuilt
      - *checkout
      - name: Infer Targets
        uses: ./.github/actions/bazel
        with:
          run: |
            # Local system-tests will run on the Remote Execution Cluster @ Namespace
            # via the .github/workflows/ci-rbe-evaluation.yml job so skip them in this job:
            targets_args=(--exclude_tags=local_system_test)
            if [[ '${{ needs.config.outputs.skip_long_tests }}' == 'true' ]]; then
              targets_args+=("--skip_long_tests")
            fi
            if [[ '${{ needs.config.outputs.skip_buf_checks }}' == 'true' ]]; then
              targets_args+=("--exclude_tags=buf")
            fi
            if [[ '${{ needs.config.outputs.diff-only }}' == 'true' ]]; then
              targets_args+=(
                '--base=${{ github.event.pull_request.base.sha }}'
                '--head=${{ github.event.pull_request.head.sha }}'
                )
            fi

            # creates a list of targets suitable for --target_pattern_file and list
            # the targets on the step summary
            /usr/bin/time ci/scripts/targets.py build "${targets_args[@]}" >"${{ runner.temp }}/build-targets"
            /usr/bin/time ci/scripts/targets.py test "${targets_args[@]}" >"${{ runner.temp }}/test-targets"

      - name: Upload target files
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-targets
          path: |
            ${{ runner.temp }}/build-targets
            ${{ runner.temp }}/test-targets

  bazel-test-all:
    name: Bazel Test All
    needs: [config, infer-bazel-targets]
    outputs:
      manifest-sha256: ${{ steps.upload-artifacts.outputs.manifest-sha256 }}
    environment:
      # The `Upload artifacts` step below only executes if `release-build == 'true'` which is the case on protected branches.
      # It also requires the AWS and CF secrets which are only available in the `upload-artifacts` environment.
      # This environment is also only active on protected branches. That's why we require the `upload-artifacts` environment
      # when `release-build == 'true'` but not otherwise.
      name: ${{ case(needs.config.outputs.release-build == 'true', 'upload-artifacts', '') }}
    runs-on: *dind-large-setup
    container: *container-setup
    timeout-minutes: 150
    steps:
      - *checkout
      - uses: ./.github/actions/netrc
      - name: "Node Name"
        run: |
          echo "::notice::Node Name: ${NODE_NAME}"

      - name: Infer Bazel Args
        id: infer-bazel-args
        shell: bash
        run: |
          # Determine bazel_args based on event type or branch name
          bazel_args=( --config=flaky_retry ) # auto retry eg systests
          if [[ "$CI_EVENT_NAME" == 'merge_group' ]]; then
              bazel_args+=( --test_timeout_filters=short,moderate --flaky_test_attempts=3 )
          elif [[ $BRANCH_NAME =~ ^hotfix- ]]; then
              bazel_args+=( --test_timeout_filters=short,moderate )
          else
              bazel_args+=( --keep_going )
          fi

          if [[ '${{ needs.config.outputs.release-build }}' == 'true' ]]; then
            # make sure the version is stamped in
            bazel_args+=( --config=stamped )
          fi

          echo "bazel-args=${bazel_args[@]}" >> $GITHUB_OUTPUT

      - name: Download target files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bazel-targets
          path: ~/.cache/bazel-targets

      - name: Run Bazel Commands
        uses: ./.github/actions/bazel
        with:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          execlogs-artifact-name: execlogs-bazel-build
          invocation-names: build
          run: |
            echo "Building as user: $(whoami)"
            echo "Bazel version: $(bazel version)"

            bazel_args='${{ steps.infer-bazel-args.outputs.bazel-args }}'

            build_targets="$HOME/.cache/bazel-targets/build-targets"
            eval "bazel build $bazel_args --target_pattern_file=$build_targets"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        if: needs.config.outputs.release-build == 'true'
        with:
          role-session-name: "GitHub-Actions_ic_upload-artifacts"
          role-to-assume: ${{ vars.AWS_ASSUME_ROLE }}
          aws-region: eu-central-1

      - name: Upload artifacts
        id: upload-artifacts
        uses: ./.github/actions/upload-artifacts
        if: needs.config.outputs.release-build == 'true'
        env:
          CF_AWS_ACCESS_KEY_ID: ${{ secrets.CF_AWS_ACCESS_KEY_ID }}
          CF_AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_AWS_SECRET_ACCESS_KEY }}
        with:
          name: Bazel Test All
          manifest-name: upload-manifest-main
          # with --check_up_to_date Bazel will error out if the artifacts
          # to be uploaded were not built in the build step above
          # (this ensures that the exact artifacts built above are uploaded)
          upload-command: bazel run --check_up_to_date //:upload-artifacts

      # GitHub runners override the container's entrypoint which is ci/container/init.sh
      # so we run it explicitly here to ensure the system is set up correctly for running local system-tests.
      - run: ci/container/init.sh

      - name: Run Tests
        uses: ./.github/actions/bazel
        with:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          execlogs-artifact-name: execlogs-bazel-test
          invocation-names: test
          run: |
            bazel_args='${{ steps.infer-bazel-args.outputs.bazel-args }}'

            test_targets="$HOME/.cache/bazel-targets/test-targets"
            if [ -s "$test_targets" ]; then # bazel errors out if no test targets are listed
              eval "bazel test $bazel_args --target_pattern_file=$test_targets"
            fi

  # Build & upload arm64-{linux,darwin} binaries,
  # build the entire codebase on arm64-darwin,
  # and run tests tagged to run on all platforms.
  # NOTE: uses 'namespace.so' runners.
  bazel-test-arm64:
    strategy:
      matrix:
        include:
          - os: linux
            profile: namespace-profile-arm64-linux # profile created in namespace console
          - os: darwin
            profile: namespace-profile-darwin # profile created in namespace console
    name: Bazel Test arm64-${{ matrix.os }}
    runs-on: ${{ matrix.profile }}
    timeout-minutes: 120
    needs: [config]
    if: github.repository == 'dfinity/ic' # only run on public repo, not private since Namespace runners are not configured there, so these CI jobs get stuck otherwise.
    outputs:
      arm64-linux-sums: ${{ steps.sums.outputs.arm64-linux-sums }}
      arm64-darwin-sums: ${{ steps.sums.outputs.arm64-darwin-sums }}
      x86_64-darwin-sums: ${{ steps.sums.outputs.x86_64-darwin-sums }}
    steps:
      - name: Set up Bazel cache
        run: |
          # Creates a bazelrc configuration fragment which tells bazel where the cache lives.
          nsc bazel cache setup --enable_remote_asset_api --bazelrc=/tmp/bazel-cache.bazelrc
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/netrc
      - name: Build and Test
        run: |
          bazel \
            --noworkspace_rc \
            --bazelrc=./bazel/conf/.bazelrc.build --bazelrc=/tmp/bazel-cache.bazelrc \
            build \
            //publish/binaries:pocket-ic.gz \
            //publish/binaries:ic-admin.gz \
            //publish/binaries:sns.gz

          mkdir -p build
          cp \
            ./bazel-bin/publish/binaries/pocket-ic.gz \
            ./build/pocket-ic-server-arm64-${{ matrix.os }}.gz
          cp \
            ./bazel-bin/publish/binaries/ic-admin.gz \
            ./build/ic-admin-arm64-${{ matrix.os }}.gz
          cp \
            ./bazel-bin/publish/binaries/sns.gz \
            ./build/sns-arm64-${{ matrix.os }}.gz

      - name: Build pocket-ic-server x86_64-darwin
        if: ${{ matrix.os == 'darwin' }}
        run: |
          bazel \
            --noworkspace_rc \
            --bazelrc=./bazel/conf/.bazelrc.build --bazelrc=/tmp/bazel-cache.bazelrc \
            build \
            //publish/binaries:pocket-ic.gz --platforms=//:macos-intel

          mkdir -p build
          cp \
            ./bazel-bin/publish/binaries/pocket-ic.gz \
            ./build/pocket-ic-server-x86_64-darwin.gz

      - name: Record artifact checksums
        id: sums
        if: ${{ needs.config.outputs.release-build == 'true' }}
        shell: bash
        env:
          OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          cd build

          # macOS runners may only have perl's shasum, not GNU coreutils
          # (same fallback as in .github/actions/bazel).
          if command -v sha256sum >/dev/null; then
            sha256() { sha256sum "$@"; }
          else
            sha256() { shasum -a 256 "$@"; }
          fi

          # Record the sha256sum lines of every file uploaded as an Actions
          # artifact below in this job's outputs. The
          # upload-external-artifacts job re-checks the downloaded artifacts
          # against them before re-uploading anything to the CDN: an Actions
          # artifact can be replaced mid-run by anything holding an
          # `actions: write` token, but job outputs cannot be tampered with
          # by other jobs. Recording happens right after the builds so the
          # whole-codebase build and test steps below stay outside this
          # trust chain: should any of them overwrite these files, the
          # uploaded artifact no longer matches its recorded sums and
          # verification fails loudly.
          sha256 \
            "pocket-ic-server-arm64-$OS.gz" \
            "ic-admin-arm64-$OS.gz" \
            "sns-arm64-$OS.gz" \
            | LC_ALL=C sort -k2 >"$RUNNER_TEMP/arm64-sums"
          {
            echo "arm64-$OS-sums<<SUMS"
            cat "$RUNNER_TEMP/arm64-sums"
            echo "SUMS"
          } >>"$GITHUB_OUTPUT"

          if [[ "$OS" == darwin ]]; then
            {
              echo "x86_64-darwin-sums<<SUMS"
              sha256 pocket-ic-server-x86_64-darwin.gz
              echo "SUMS"
            } >>"$GITHUB_OUTPUT"
          fi

      # Ensures that local development works on arm64-darwin.
      - name: Build the entire codebase on darwin
        if: ${{ matrix.os == 'darwin' }}
        run: |
          # We do not use `//...` here to exclude `//publish/...` which is not required for local development.
          bazel_build_targets=(
            //rs/...
            //packages/...
          )

          bazel \
            --noworkspace_rc \
            --bazelrc=./bazel/conf/.bazelrc.build --bazelrc=/tmp/bazel-cache.bazelrc \
            build \
            "${bazel_build_targets[@]}"

      - name: Run tests tagged to run on all platforms
        run: |
          # We do not use `//...` here to exclude `//publish/...` which does not build on arm64-linux.
          bazel_test_targets=(
            //rs/...
            //packages/...
          )

          bazel \
            --noworkspace_rc \
            --bazelrc=./bazel/conf/.bazelrc.build --bazelrc=/tmp/bazel-cache.bazelrc \
            test \
            --config=flaky_retry \
            --test_tag_filters="test_all_platforms,test_all_platforms_slow" \
            --build_tests_only \
            "${bazel_test_targets[@]}"

      - name: Upload pocket-ic-server x86_64-darwin
        if: ${{ matrix.os == 'darwin' && needs.config.outputs.release-build == 'true' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pocket-ic-server-x86_64-darwin.gz
          path: ./build/pocket-ic-server-x86_64-darwin.gz

      - name: Upload arm64-${{ matrix.os }} artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ needs.config.outputs.release-build == 'true' }}
        with:
          name: arm64-binaries-${{ matrix.os }}.gz
          path: |
            ./build/pocket-ic-server-arm64-${{ matrix.os }}.gz
            ./build/ic-admin-arm64-${{ matrix.os }}.gz
            ./build/sns-arm64-${{ matrix.os }}.gz

  # Upload external artifacts, retrieved from non-DFINITY runner builds.
  upload-external-artifacts:
    name: Upload external artifacts
    needs: [bazel-test-arm64, config]
    if: ${{ needs.config.outputs.release-build == 'true' }} # GHA output quirk, 'true' is a string
    outputs:
      manifest-sha256: ${{ steps.upload-artifacts.outputs.manifest-sha256 }}
    # The `Upload artifacts` step below requires the AWS & CF secrets
    # which are only available in the `upload-artifacts` environment.
    environment: upload-artifacts
    runs-on: *dind-large-setup
    container: *container-setup
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download arm64-linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arm64-binaries-linux.gz
          # avoid downloading to workspace to avoid version being marked as dirty
          path: ~/.cache/arm64-binaries-linux

      - name: Download arm64-darwin artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arm64-binaries-darwin.gz
          # avoid downloading to workspace to avoid version being marked as dirty
          path: ~/.cache/arm64-binaries-darwin

      - name: Download pocket-ic-server (x86_64-darwin)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pocket-ic-server-x86_64-darwin.gz
          # avoid downloading to workspace to avoid version being marked as dirty
          path: ~/.cache/pocket-ic-server-x86_64-darwin

      - name: Verify downloaded artifacts
        shell: bash
        env:
          ARM64_LINUX_SUMS: ${{ needs.bazel-test-arm64.outputs.arm64-linux-sums }}
          ARM64_DARWIN_SUMS: ${{ needs.bazel-test-arm64.outputs.arm64-darwin-sums }}
          X86_64_DARWIN_SUMS: ${{ needs.bazel-test-arm64.outputs.x86_64-darwin-sums }}
        run: |
          set -euo pipefail

          # Re-check every file downloaded above against the sha256sum lines
          # the producing bazel-test-arm64 legs recorded in their job
          # outputs, before anything is bundled and re-uploaded to the CDN:
          # an Actions artifact can be replaced mid-run by anything holding
          # an `actions: write` token, but job outputs cannot be tampered
          # with by other jobs. A missing or empty output also fails here:
          # sha256sum rejects input without valid checksum lines.
          check() { # <download-dir> <recorded sha256sum lines>
            echo "$2" | (cd "$1" && sha256sum --check --strict)
            # Also reject artifacts carrying anything beyond the recorded files
            diff <(echo "$2" | awk '{print $2}' | LC_ALL=C sort) \
              <(cd "$1" && find . -mindepth 1 | sed 's|^\./||' | LC_ALL=C sort)
          }
          check ~/.cache/arm64-binaries-linux "$ARM64_LINUX_SUMS"
          check ~/.cache/arm64-binaries-darwin "$ARM64_DARWIN_SUMS"
          check ~/.cache/pocket-ic-server-x86_64-darwin "$X86_64_DARWIN_SUMS"

      - name: Prepare bundle
        id: prepare-bundle
        run: |
          bundledir=$(mktemp -d)

          # Create a "bundle" that the uploader can digest
          mkdir -p "$bundledir/binaries/arm64-linux/"
          cp ~/.cache/arm64-binaries-linux/pocket-ic-server-arm64-linux.gz "$bundledir/binaries/arm64-linux/pocket-ic.gz"
          cp ~/.cache/arm64-binaries-linux/ic-admin-arm64-linux.gz "$bundledir/binaries/arm64-linux/ic-admin.gz"
          cp ~/.cache/arm64-binaries-linux/sns-arm64-linux.gz "$bundledir/binaries/arm64-linux/sns.gz"

          mkdir -p "$bundledir/binaries/arm64-darwin/"
          cp ~/.cache/arm64-binaries-darwin/pocket-ic-server-arm64-darwin.gz "$bundledir/binaries/arm64-darwin/pocket-ic.gz"
          cp ~/.cache/arm64-binaries-darwin/ic-admin-arm64-darwin.gz "$bundledir/binaries/arm64-darwin/ic-admin.gz"
          cp ~/.cache/arm64-binaries-darwin/sns-arm64-darwin.gz "$bundledir/binaries/arm64-darwin/sns.gz"

          mkdir -p "$bundledir/binaries/x86_64-darwin/"
          cp ~/.cache/pocket-ic-server-x86_64-darwin/pocket-ic-server-x86_64-darwin.gz "$bundledir/binaries/x86_64-darwin/pocket-ic.gz"

          # Give these hand-assembled directories the same SHA256SUMS file
          # that the bazel-built bundles get from the artifact_bundle rule
          # so every binaries/<platform>/ directory on the CDN carries
          # a checksum manifest that release workflows can verify
          # against its attestation.
          for d in arm64-linux arm64-darwin x86_64-darwin; do
            (cd "$bundledir/binaries/$d" && sha256sum *.gz | LC_ALL=C sort -k2 >SHA256SUMS)
          done

          echo bundledir="$bundledir" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-session-name: "GitHub-Actions_ic_upload-artifacts"
          role-to-assume: ${{ vars.AWS_ASSUME_ROLE }}
          aws-region: eu-central-1

      - name: Upload artifacts
        id: upload-artifacts
        uses: ./.github/actions/upload-artifacts
        env:
          CF_AWS_ACCESS_KEY_ID: ${{ secrets.CF_AWS_ACCESS_KEY_ID }}
          CF_AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_AWS_SECRET_ACCESS_KEY }}
        with:
          name: arm64 artifacts
          manifest-name: upload-manifest-external
          upload-command: bazel run --config=stamped //:artifact-uploader -- ${{ steps.prepare-bundle.outputs.bundledir }}

  # Merge the per-job upload manifests into the single upload-manifest
  # artifact exposed through this workflow's `manifest-sha256` output.
  upload-manifests:
    name: Merge upload manifests
    needs: [config, bazel-test-all, upload-external-artifacts]
    if: ${{ needs.config.outputs.release-build == 'true' }} # GHA output quirk, 'true' is a string
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      manifest-sha256: ${{ steps.merge.outputs.sha256 }}
    steps:
      - name: Download main upload manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upload-manifest-main
          path: ${{ runner.temp }}/upload-manifests/main

      - name: Download external upload manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upload-manifest-external
          path: ${{ runner.temp }}/upload-manifests/external

      - name: Verify and merge manifests
        id: merge
        shell: bash
        env:
          MANIFEST_SHA256_MAIN: ${{ needs.bazel-test-all.outputs.manifest-sha256 }}
          MANIFEST_SHA256_EXTERNAL: ${{ needs.upload-external-artifacts.outputs.manifest-sha256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/upload-manifests"

          # Verify the downloaded artifacts against the hashes recorded in
          # the producing jobs' outputs before merging anything: an Actions
          # artifact can be replaced mid-run by anything holding an
          # `actions: write` token, but job outputs cannot be tampered with
          # by other jobs. A missing or empty output also fails here:
          # sha256sum rejects the malformed line.
          echo "$MANIFEST_SHA256_MAIN  main/upload-manifest.sha256sums" | sha256sum --check
          echo "$MANIFEST_SHA256_EXTERNAL  external/upload-manifest.sha256sums" | sha256sum --check

          LC_ALL=C sort -k2 \
            main/upload-manifest.sha256sums \
            external/upload-manifest.sha256sums \
            >upload-manifest.sha256sums

          echo "sha256=$(sha256sum upload-manifest.sha256sums | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"

      - name: Upload merged manifest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: upload-manifest
          path: ${{ runner.temp }}/upload-manifests/upload-manifest.sha256sums
          if-no-files-found: error

  python-ci-tests:
    name: Python CI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Run Python CI Tests
        shell: bash
        run: |
          set -xeuo pipefail
          export PYTHONPATH=$PWD/ci/src:$PWD/ci/src/dependencies
          # Ignore externally-managed-environment pip error, install packages system-wide.
          PIP_BREAK_SYSTEM_PACKAGES=1 pip3 install --ignore-installed -r requirements.txt
          cd ci/src
          pytest -m "not fails_on_merge_train" -v -o junit_family=xunit1 \
            --junitxml=../../test_report.xml --cov=. --cov-report=term \
            --cov-report=term-missing --cov-report=html --cov-branch
        env:
          CI_COMMIT_REF_PROTECTED: ${{ github.ref_protected }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO_NAME: ${{ github.repository }}

  build-ic:
    needs: [config, infer-bazel-targets]
    name: Build IC
    runs-on: *dind-large-setup
    container: *container-setup
    timeout-minutes: 90
    if: ${{ github.event_name != 'merge_group' }}
    steps:
      - *checkout
      - uses: ./.github/actions/netrc
      - name: "Node Name"
        run: |
          echo "::notice::Node Name: ${NODE_NAME}"
      - name: Download target files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bazel-targets
          path: ~/.cache/bazel-targets
      - name: Run Build IC
        uses: ./.github/actions/bazel
        with:
          execlogs-artifact-name: execlogs-build-ic
          run: |
            set -euo pipefail

            cd "$CI_PROJECT_DIR"

            # run full release build on "protected" branches
            if [[ '${{ needs.config.outputs.release-build }}' == 'true' ]]; then
                ci/container/build-ic.sh -i -c -b
                exit 0
            fi

            # run full non-release build if not asked to diff
            if [[ '${{ needs.config.outputs.diff-only }}' != 'true' ]]; then
                ci/container/build-ic.sh -i -c -b --no-release
                exit 0
            fi

            # otherwise, infer targets to build
            target_pattern_file="$HOME/.cache/bazel-targets/build-targets"

            ARGS=()

            if grep -q '^//ic-os' <"$target_pattern_file"; then
                ARGS+=(-i)
            fi
            if grep -q '^//publish/canisters' <"$target_pattern_file"; then
                ARGS+=(-c)
            fi
            if grep -q '^//publish/binaries' <"$target_pattern_file"; then
                ARGS+=(-b)
            fi

            if [[ ${#ARGS[@]} -eq 0 ]]; then
                echo "No changes that require building IC-OS, binaries or canisters."
                exit 0
            fi

            ci/container/build-ic.sh "${ARGS[@]}" --no-release

  build-determinism:
    name: Build Determinism
    runs-on: ubuntu-latest
    needs: [build-ic, bazel-test-all]
    # Run even when `bazel-test-all` fails: its test failures happen *after*
    # its build succeeded, its execution logs were uploaded (the bazel action
    # uploads them on failure too) and — on release builds — the artifacts
    # were already published to the CDN. Without this condition a single
    # failing/flaky test silently skipped the determinism check while the
    # artifacts still shipped. `build-ic` still has to succeed: it produces the
    # no-cache side of the comparison (and is skipped on merge_group, where
    # there is nothing to compare).
    if: ${{ !cancelled() && needs.build-ic.result == 'success' }}
    steps:
      - name: Download execution logs (cache)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: execlogs-bazel-build
          path: execlogs-cache
      - name: Download execution logs (nocache)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: execlogs-build-ic
          path: execlogs-nocache
      - name: Build Determinism Test
        run: |
          set -euo pipefail

          n_lines_cache=$(cat execlogs-cache/execlogs.csv | wc -l)
          n_lines_nocache=$(cat execlogs-nocache/execlogs.csv | wc -l)
          echo "comparing $n_lines_cache (cache) and $n_lines_nocache (nocache) lines"

          # running tests may not pull all targets locally. If that's the case,
          # there will be 0 lines and nothing to compare.
          if [ "$n_lines_cache" -eq 0 ] || [ "$n_lines_nocache" -eq 0 ]; then
            echo "No lines to compare"
            exit 0
          fi

          # sort the files by the field we join on (artifact path), see below
          sponge=$(mktemp)

          sort -t, -k2 <execlogs-cache/execlogs.csv >"$sponge"
          cp "$sponge" execlogs-cache/execlogs.csv

          sort -t, -k2 <execlogs-nocache/execlogs.csv >"$sponge"
          cp "$sponge" execlogs-nocache/execlogs.csv

          rm "$sponge"

          # join the CSVs (separator ',') and compare the hashes. This creates a table with the following columns:
          #   //rs/foo,bazel-out/path/to-artifact,deadbeef,deafb33f
          # target label (1.1), artifact path (1.2), and hashes (1.3 & 2.3). The join is done
          # on the artifact path, second field on input one (-1) and input two (-2) :'-12 -22'
          # The output is then compared with awk, printing mismatches, and keeping track of how many mismatches we
          # encountered.
          join \
            -t, -o 1.1,1.2,1.3,2.3 -12 -22 \
            execlogs-cache/execlogs.csv \
            execlogs-nocache/execlogs.csv \
            | awk -F, 'BEGIN { N_BAD=0; } $3 != $4 { print $1 " " $2 ": " $3 " != " $4; N_BAD++; } END { if (N_BAD) { print N_BAD " mismatches found"; exit 1; } else { print "No mismatches"; }; }' \
            | column -t | sort

  cargo-linux:
    strategy:
      matrix:
        include:
          - name: Lint
          - name: Build
    name: Cargo  ${{ matrix.name }} Linux
    runs-on:
      labels: dind-small
    container: *container-setup
    timeout-minutes: 30
    steps:
      - *checkout
      - name: Filter Rust Files [*.{rs,toml,lock}]
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          ref: ${{ inputs.commit-sha }}
          filters: |
            cargo:
              - "**/*.rs"
              - "**/*.toml"
              - "**/*.lock"
              - "ci/scripts/rust-lint.sh"
              - "ci/container/TAG"
              - "ci/container/ic-build.digest"
              - "ci/container/ic-dev.digest"
              - ".github/**"
      - name: Run Cargo ${{ matrix.name }} Linux
        if: |
          steps.filter.outputs.cargo == 'true' ||
          contains(github.event.pull_request.labels.*.name, 'CI_RUN_CARGO_JOBS') ||
          env.BRANCH_NAME == 'master' ||
          startsWith(env.BRANCH_NAME, 'rc--') ||
          startsWith(env.BRANCH_NAME, 'hotfix-')
        shell: bash
        env:
          # on dind_small cargo sometimes runs out of files (when building and linting). This trades
          # some performance for reliability.
          # (at the time of writing, nproc returns 64 on dind_small where this job runs)
          CARGO_BUILD_JOBS: 32
        run: |
          set -eExuo pipefail
          export CARGO_TERM_COLOR=always # ensure output has colors

          if [[ "${{ matrix.name }}" == "Lint" ]]; then
            "$CI_PROJECT_DIR"/ci/scripts/rust-lint.sh
          else
            cargo build --release --locked
          fi

  check-pull-request-bazel-targets:
    name: Check PULL_REQUEST_BAZEL_TARGETS
    runs-on:
      labels: dind-small
    container: *container-setup
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/netrc
      - name: Check PULL_REQUEST_BAZEL_TARGETS
        uses: ./.github/actions/bazel
        with:
          run: ./ci/scripts/targets.py check

# only run on pull-request event - they are also triggered from schedule-daily.yml
  pocket-ic-tests-windows:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pocket-ic-tests-windows.yml
    with:
      commit-sha: ${{ github.sha }}

  test-container-run:
    name: Test Container Run ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Happy paths: the pinned image is pulled by digest, verified and run.
          - name: ic-dev default
            setup: ""
            command: ""
            expect: success
            runtime: podman
          - name: ic-build
            setup: ""
            command: "--image ic-build bash"
            expect: success
            runtime: podman
          # A local image squatting on the tag must be ignored: the pinned digest
          # is pulled and run instead, and the tag is re-pointed to it (checked by
          # the "Verify the poisoned tag ..." step below). The squatter is an
          # empty image that cannot run anything, so a successful `true` already
          # proves the pinned image ran.
          - name: poisoned local tag
            setup: |
              tar -cf empty.tar -T /dev/null
              repo=ghcr.io/dfinity
              sudo podman import empty.tar "$repo/ic-dev:$(< ci/container/TAG)"
            command: "true"
            expect: success
            runtime: podman
          # A tampered pin must be refused before anything is pulled or built.
          - name: malformed pin refused
            setup: echo not-a-digest > ci/container/ic-dev.digest
            command: "true"
            expect: "refusing to pull an unpinned image"
            runtime: podman
          # A well-formed pin the registry does not serve: the pull fails and, by
          # default, neither a local build nor a cached image is used.
          - name: unknown digest refused
            setup: printf 'sha256:%064d\n' 0 > ci/container/ic-dev.digest
            command: "true"
            expect: "refusing to build an unpinned image locally"
            runtime: podman
          # The same failed pull while a local image squats on the tag: the cached
          # mutable-tag image must not be run either (only
          # CONTAINER_RUN_ALLOW_UNPINNED=1 permits that), so this still refuses.
          - name: unknown digest with poisoned local tag refused
            setup: |
              tar -cf empty.tar -T /dev/null
              repo=ghcr.io/dfinity
              sudo podman import empty.tar "$repo/ic-dev:$(< ci/container/TAG)"
              printf 'sha256:%064d\n' 0 > ci/container/ic-dev.digest
            command: "true"
            expect: "refusing to build an unpinned image locally"
            runtime: podman
          - name: docker runtime
            setup: ""
            command: "true"
            expect: success
            runtime: docker
    steps:
      - *checkout
      - name: Workaround for actions/runner-images#14473 (crun pinning)
        if: matrix.runtime == 'podman'
        run: |
          # Workaround for actions/runner-images#14473:
          # Podman 5.x on ubuntu-24.04/22.04 picks /usr/bin/crun (1.14.1) over
          # /usr/local/bin/crun (1.28). Pin it explicitly.
          #
          # container-run.sh always invokes podman as `sudo podman`, which
          # resets $HOME, so a per-user containers.conf drop-in under $HOME
          # would never be seen by (rootful) podman. Instead, use
          # container-run.sh's own ~/.container-run.conf hook: it is sourced
          # in the invoking (non-root) shell *before* `sudo podman run` is
          # exec'd, and PODMAN_RUN_USR_ARGS is appended as CLI args to that
          # `podman run` call -- which, unlike $HOME, survive sudo.
          if command -v podman &>/dev/null && [ -x /usr/local/bin/crun ]; then
            echo 'PODMAN_RUN_USR_ARGS=(--runtime /usr/local/bin/crun)' >>~/.container-run.conf
          fi
      - name: Filter Relevant Files
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          ref: ${{ inputs.commit-sha }}
          filters: |
            container-run:
              - '.github/workflows/ci-main.yml'
              - '.github/workflows/ci-pr-only.yml'
              - '.github/workflows/container-autobuild.yml'
              - 'ci/container/**'
            pins:
              - '.devcontainer/**'
              - '.github/workflows/**'
      - name: Decide whether to run
        id: decide
        if: |
          steps.filter.outputs.container-run == 'true' ||
          env.BRANCH_NAME == 'master' ||
          startsWith(env.BRANCH_NAME, 'rc--') ||
          startsWith(env.BRANCH_NAME, 'hotfix-')
        run: echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Check the digest pins are consistent
        if: steps.decide.outputs.run == 'true' || steps.filter.outputs.pins == 'true'
        run: |
          # ci/container/*.digest, the ic-dev pin in .devcontainer/ and the ic-build
          # pins in the workflows are all written by container-autobuild.yml and
          # must agree. Never compare against what the registry serves under
          # ci/container/TAG: that would make the mutable tag the oracle again.
          #
          # container-autobuild.yml rewrites every "<prefix>ic-build[:@]..." string
          # under .github/workflows/ with sed, so the image names below are kept
          # in a variable to keep this script from being rewritten too.
          set -euo pipefail
          prefix="ghcr.io/dfinity/"
          dev_digest="$(< ci/container/ic-dev.digest)"
          build_digest="$(< ci/container/ic-build.digest)"
          for digest in "$dev_digest" "$build_digest"; do
            if ! [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::malformed digest '$digest' in ci/container/*.digest (they are written by container-autobuild.yml)"
              exit 1
            fi
          done
          # Every reference to either image (":tag" or "@digest", well-formed or
          # not) in both consumer locations must be exactly the pinned digest
          # reference, so a reference changed to a mutable tag or a malformed
          # digest is rejected too, not only a mismatching well-formed one. At
          # least one reference per image must exist (it does today), which also
          # guards against the grep pattern going stale.
          check_refs() { # $1 = image, $2 = pinned digest
            local refs
            # grep exits 1 when nothing matches; treat that as an empty set so the
            # comparison below reports it instead of pipefail aborting the step.
            refs="$({ grep -rhoE "${prefix}$1[:@][^\"'[:space:]]+" .devcontainer .github/workflows || true; } | sort -u)"
            if [ "$refs" != "${prefix}$1@$2" ]; then
              echo "::error file=ci/container/$1.digest::every $1 reference in .devcontainer/ and .github/workflows/ must be ${prefix}$1@$2 (ci/container/$1.digest; all are written by container-autobuild.yml), found:"
              echo "${refs:-<none>}"
              exit 1
            fi
          }
          check_refs ic-dev "$dev_digest"
          check_refs ic-build "$build_digest"
      - name: Check ci/container/TAG matches the container inputs
        id: sync
        if: steps.decide.outputs.run == 'true'
        run: |
          # When TAG is out of sync there is no reviewed digest for the working
          # tree and container-run.sh refuses to run (it only builds locally with
          # CONTAINER_RUN_ALLOW_UNPINNED=1), so every leg below would fail. On a
          # pull request that state is transient: the container-autobuild.yml bot
          # commit brings TAG and *.digest in sync and re-triggers CI. (PRs from
          # forks cannot change the container inputs: touching ci/* closes them
          # automatically, see .github/repo_policies/EXTERNAL_CONTRIB_BLACKLIST.)
          # Anywhere else (push to master, the merge queue, release-testing on
          # rc--/hotfix-, a manual dispatch) it means that commit never landed,
          # so fail.
          set -euo pipefail
          computed="$(ci/container/get-image-tag.sh)"
          pinned="$(< ci/container/TAG)"
          if [ "$computed" = "$pinned" ]; then
            echo "in_sync=true" >> "$GITHUB_OUTPUT"
          elif [ "$CI_EVENT_NAME" = pull_request ]; then
            echo "::notice file=ci/container/TAG::ci/container/TAG ($pinned) does not match the container inputs (computed $computed); skipping the container-run tests: the Container IC Build Image workflow will commit TAG and *.digest to this branch and re-trigger CI"
            echo "in_sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error file=ci/container/TAG::ci/container/TAG ($pinned) does not match the container inputs (computed $computed): the container-autobuild.yml commit did not land on $BRANCH_NAME ($CI_EVENT_NAME)"
            exit 1
          fi
      - name: Set up "${{ matrix.name }}"
        if: steps.sync.outputs.in_sync == 'true' && matrix.setup != ''
        run: ${{ matrix.setup }}
      - name: Test Container Run
        if: steps.sync.outputs.in_sync == 'true'
        env:
          CONTAINER_RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.expect }}" = success ]; then
            ./ci/container/container-run.sh ${{ matrix.command }}
            exit 0
          fi
          # A tampered pin must fail fast: not succeed, not hit the timeout, and
          # not fall through to a local build that merely times the job out.
          # Snapshot the store first: a refusal must leave it untouched (nothing
          # pulled or built) and must not have run anything, in particular not an
          # image the setup step cached under the mutable tag.
          images_before="$(sudo podman images --no-trunc -q | sort -u)"
          containers_before="$(sudo podman ps -aq)"
          set +e
          out="$(timeout 300 ./ci/container/container-run.sh ${{ matrix.command }} 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 124 ]; then
            echo "::error::expected container-run.sh to refuse quickly, got exit code $rc"
            exit 1
          fi
          if ! grep -qF -- "${{ matrix.expect }}" <<<"$out"; then
            echo "::error::expected the output to contain '${{ matrix.expect }}'"
            exit 1
          fi
          if [ "$(sudo podman images --no-trunc -q | sort -u)" != "$images_before" ]; then
            echo "::error::an image was pulled or built despite the refusal"
            exit 1
          fi
          if [ "$(sudo podman ps -aq)" != "$containers_before" ]; then
            echo "::error::a container was run despite the refusal"
            exit 1
          fi
      - name: Verify the poisoned tag was re-pointed to the verified image
        if: steps.sync.outputs.in_sync == 'true' && matrix.name == 'poisoned local tag'
        run: |
          set -euo pipefail
          repo=ghcr.io/dfinity
          tag="$repo/ic-dev:$(< ci/container/TAG)"
          want="$repo/ic-dev@$(< ci/container/ic-dev.digest)"
          digests="$(sudo podman image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$tag")"
          printf '%s\n' "$digests"
          if ! grep -qxF "$want" <<<"$digests"; then
            echo "::error::$tag does not carry the pinned digest $want after the run"
            exit 1
          fi
