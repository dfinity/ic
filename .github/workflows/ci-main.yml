name: CI Main

on:
  workflow_call:
    inputs:
      commit-sha:
        description: The commit sha to run the CI on
        required: true
        type: string
      release-build:
        description: Whether this CI run is for a release build, which may require additional steps such as uploading artifacts.
        required: false
        default: ''
        type: string
    secrets:
      BEP_GPG_PASSPHRASE:
        description: Encrypts the build event files that the bazel action uploads
        required: false
      CF_AWS_ACCESS_KEY_ID:
        description: Uploads the artifacts of release builds; an upload-artifacts environment secret that the caller must pass (secrets inherit)
        required: false
      CF_AWS_SECRET_ACCESS_KEY:
        description: Uploads the artifacts of release builds; an upload-artifacts environment secret that the caller must pass (secrets inherit)
        required: false

# This reusable workflow declares no `permissions:` of its own: its jobs run with
# exactly the GITHUB_TOKEN permissions the calling job grants. Callers that run
# release builds (ci-kickoff.yml, release-testing.yml) grant on their `ci-main` job:
#   actions: write        # artifact uploads of bazel-test-arm64 (#9634)
#   attestations: write   # Attest steps of bazel-test-all / upload-external-artifacts
#   contents: read
#   id-token: write       # AWS OIDC role assumption and Sigstore signing
#   pull-requests: read
# ci-kickoff-manual.yml (CI for pull requests from forks) grants only `contents: read`
# and `pull-requests: read`: these jobs run the PR's code, and it never runs a release
# build. A permission declared here would be validated against every caller's grant at
# parse time regardless of `if:` (https://github.com/orgs/community/discussions/155062)
# and so would force that grant onto fork-PR runs. Declaring none lets fork-PR builds
# stay read-only; the price is that a caller missing a grant fails at runtime (e.g.
# HTTP 403 in the Attest step) rather than at parse time.

env:
  CI_COMMIT_SHA: ${{ inputs.commit-sha }}
  CI_JOB_NAME: ${{ github.job }}
  CI_PROJECT_DIR: ${{ github.workspace }}
  CI_EVENT_NAME: ${{ github.event_name }}
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  CI_RUN_ID: ${{ github.run_id }}

jobs:
  bazel-run-fuzzers:
    name: Bazel Run Fuzzers
    runs-on: &dind-large-setup
      labels: dind-large
    container: &container-setup
      image: ghcr.io/dfinity/ic-build@sha256:6184a4beddca0e898c9e2113b2dd78f0391caefef7c13090c56ae1ab7b1ec399
      options: >-
         -e NODE_NAME --privileged --cgroupns host --mount type=tmpfs,target="/tmp/containers"
    timeout-minutes: 90
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ case(github.event_name == 'pull_request', 256, 0) }}
          ref: ${{ inputs.commit-sha }}
      - name: Filter fuzzer related files
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        if: github.event_name == 'pull_request'
        id: filter
        with:
          ref: ${{ inputs.commit-sha }}
          filters: |
            fuzzers:
              - ".github/workflows/ci-main.yml"
              - "ci/container/TAG"
              - "ci/container/ic-build.digest"
              - "ci/container/ic-dev.digest"
              - "bin/fuzzing/*.sh"
              - "**/BUILD.bazel"
              - "**/*.bzl"
              - "**/*.rs"
      - uses: ./.github/actions/netrc
        if: github.event_name != 'pull_request' || steps.filter.outputs.fuzzers == 'true'
      - name: Run Libfuzzer targets
        uses: ./.github/actions/bazel
        if: github.event_name != 'pull_request' || steps.filter.outputs.fuzzers == 'true'
        with:
          invocation-names: libfuzzer
          run: ./bin/fuzzing/run-all-fuzzers.sh --libfuzzer 100
      - name: Run AFL targets
        uses: ./.github/actions/bazel
        if: github.event_name != 'pull_request' || steps.filter.outputs.fuzzers == 'true'
        with:
          invocation-names: afl
          run: ./bin/fuzzing/run-all-fuzzers.sh --afl 10

  config:
    name: Set Config
    runs-on: ubuntu-latest
    outputs:
      release-build: ${{ steps.config.outputs.release-build }}
      diff-only: ${{ steps.config.outputs.diff-only }}
      skip_long_tests: ${{ steps.config.outputs.skip_long_tests }}
      skip_buf_checks: ${{ steps.config.outputs.skip_buf_checks }}
      skip_system_tests: ${{ steps.config.outputs.skip_system_tests }}
    steps:
      - name: Infer build config
        id: config
        env:
          RELEASE_BUILD_INPUT: ${{ inputs.release-build }}
        run: |
          set -euo pipefail

          # PR labels. Both expand to 'false' on merge_group, push and workflow_dispatch.
          all_bazel_targets='${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'CI_ALL_BAZEL_TARGETS') }}'
          skip_system_tests='${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'CI_SKIP_SYSTEM_TESTS') }}'

          if [[ "$all_bazel_targets" == 'true' && "$skip_system_tests" == 'true' ]]; then
              msg="The PR labels CI_ALL_BAZEL_TARGETS and CI_SKIP_SYSTEM_TESTS are mutually exclusive. Remove one of them and retrigger CI (see .github/CI_README.md)."
              echo "::error title=Conflicting CI labels::$msg"
              echo "**Error:** $msg" >> "$GITHUB_STEP_SUMMARY"
              exit 1
          fi

          # List of "protected" branches, i.e. branches (not necessarily "protected" in the GitHub sense) where we need
          # the full build to occur (including versioning)
          protected_branches=("^master$" "^rc--" "^hotfix-")
          for pattern in "${protected_branches[@]}"; do
              if [[ "$BRANCH_NAME" =~ $pattern ]]; then
                  is_protected_branch="true"
                  break
              fi
          done

          # Only on push: a workflow_dispatch, for one, runs on whichever ref its dispatcher picks.
          if [[ "${is_protected_branch:-}" == "true" && "$CI_EVENT_NAME" == "push" ]]; then
              # if we are on a "protected" branch, targeting an rc branch or master we
              # upload all artifacts and run a release build (with versioning)
              release_build="true"
              diff_only="false"
              skip_long_tests="false"
          elif [[ '${{ github.event_name }}' == "merge_group" ]]; then
              # on a merge group, we don't upload the artifacts (i.e. no release
              # build) but we ensure all targets are built (no diff)
              release_build="false"
              diff_only="false"
              skip_long_tests="true"
          elif [[ "$all_bazel_targets" == 'true' ]]; then
              # "CI_ALL_BAZEL_TARGETS" is set and act as if we're on a protected
              # branch
              release_build="false"
              diff_only="false"
              skip_long_tests="false"
          elif [[ '${{ github.event_name == 'push' }}' == 'true' && "$BRANCH_NAME" =~ '^dev-gh-' ]]; then
              # On pushes to dev-gh-* branches don't do a release, build all targets except long_tests.
              release_build="false"
              diff_only="false"
              skip_long_tests="true"
          elif [[ '${{ github.event_name }}' == "workflow_dispatch" ]]; then
              # if a workflow is manually dispatched, we cannot easily find the file changes, therefore build all targets
              release_build="false"
              diff_only="false"
              skip_long_tests="false"
          else
              # default behavior is to not release, only build targets with modified inputs and skip long_tests.
              release_build="false"
              diff_only="true"
              skip_long_tests="true"
          fi

          # if release build was set, override whatever was determined above
          if [[ "$RELEASE_BUILD_INPUT" == "true" || "$RELEASE_BUILD_INPUT" == "false" ]]; then
              release_build="$RELEASE_BUILD_INPUT"
          elif [[ -n "$RELEASE_BUILD_INPUT" ]]; then
              echo "::error title=Invalid input::release-build must be 'true', 'false' or empty."
              exit 1
          fi

          if [[ '${{ contains(github.event.pull_request.labels.*.name, 'CI_OVERRIDE_BUF_BREAKING') }}' == 'true' ]]; then
              skip_buf_checks="true"
          else
              skip_buf_checks="false"
          fi

          echo "| config | value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"

          echo "release-build: $release_build"
          echo "release-build=$release_build" >> "$GITHUB_OUTPUT"
          echo "| \`release-build\` | \`$release_build\` |" >> "$GITHUB_STEP_SUMMARY"

          echo "diff-only: $diff_only"
          echo "diff-only=$diff_only" >> "$GITHUB_OUTPUT"
          echo "| \`diff-only\` | \`$diff_only\` |" >> "$GITHUB_STEP_SUMMARY"

          echo "skip_long_tests: $skip_long_tests"
          echo "skip_long_tests=$skip_long_tests" >> "$GITHUB_OUTPUT"
          echo "| \`skip_long_tests\` | \`$skip_long_tests\` |" >> "$GITHUB_STEP_SUMMARY"

          echo "skip_buf_checks: $skip_buf_checks"
          echo "skip_buf_checks=$skip_buf_checks" >> "$GITHUB_OUTPUT"
          echo "| \`skip_buf_checks\` | \`$skip_buf_checks\` |" >> "$GITHUB_STEP_SUMMARY"

          echo "skip_system_tests: $skip_system_tests"
          echo "skip_system_tests=$skip_system_tests" >> "$GITHUB_OUTPUT"
          echo "| \`skip_system_tests\` | \`$skip_system_tests\` |" >> "$GITHUB_STEP_SUMMARY"

  bazel-test-all:
    name: Bazel Test All
    needs: [config]
    environment:
      # The `Upload artifacts` step below only executes if `release-build == 'true'` which is the case for pushes to protected branches and for release-testing.yml.
      # It also requires the AWS and CF secrets which are only available in the `upload-artifacts` environment.
      # This environment is also only active on protected branches. That's why we require the `upload-artifacts` environment
      # when `release-build == 'true'` but not otherwise.
      name: ${{ case(needs.config.outputs.release-build == 'true', 'upload-artifacts', '') }}
    # Builds and tests on the Remote Build Execution (RBE) cluster @ Namespace: bazel runs in this job's
    # container and the actions and tests run on the RBE workers, except for the ic-os image builds,
    # which bazel/conf/.bazelrc.build forces to run locally, i.e. here. Of the system-tests only the
    # `_local` variants run (on the workers): the Farm-backed ones run in release-testing.yml
    # (system_test_large) and in the nightly workflows.
    # container.mount-scratch gives the runner a real ephemeral filesystem at /namespace/scratch.
    # The ic-os image builds put their scratch there, see the "Prepare the scratch directory" step below.
    runs-on: namespace-profile-rbe-driver-amd64-linux-16x32;container.mount-scratch=true
    container:
      # The RBE worker image of .github/actions/bazel-namespace/rbe.bazelrc: the
      # update-image-references job of container-autobuild.yml rewrites both.
      image: nscr.io/c9ptjuknd7oc6/ic-build@sha256:b897752c4c05ee6f26bf17e4dfb42f2f64ad409cbfb0b95203eeaa00ed1bd95c
      # ic-os image builds run 'podman build' (rootless) and are forced to run locally in
      # this container by --strategy_regexp=ic-os[:/].*=local in bazel/conf/.bazelrc.build.
      # Rootless podman needs to create user namespaces, which fails in an unprivileged
      # container with "cannot clone: Operation not permitted".
      options: >-
        --privileged --mount type=tmpfs,target="/tmp/containers"
      volumes:
        # nscloud-setup finds the runner's Namespace token in here and exports NSC_TOKEN_FILE,
        # which nsc reads.
        - /var/run/nsc/:/var/run/nsc/
        # The runner profile's Namespace cache volume (always /cache on the host). The
        # "Mount the Bazel repository cache" step bind-mounts a directory of it into this
        # container; mount(2) needs CAP_SYS_ADMIN, which --privileged above grants.
        - /cache:/cache
        # The runner's scratch filesystem, see runs-on above.
        - /namespace/scratch:/namespace/scratch
      env:
        # Set (to /cache) by the Namespace runner when the profile has a cache volume, and forwarded
        # into the container here; the "Prepare the Bazel repository cache" step checks it and the
        # other repository-cache steps are skipped when it is unset.
        NSC_CACHE_PATH: ${{ env.NSC_CACHE_PATH }}
    # A job timeout cancels the job, skipping the uploads of the bazel-namespace action, so this
    # exceeds the steps' timeout-minutes (35 + 20 + 100 + 60 + 160 = 375) plus all other steps (setup,
    # AWS credentials, Attest, uploads and reports take a few minutes together). Instances of DFINITY's
    # Namespace (enterprise) plan run for up to 24 hours.
    timeout-minutes: 385
    steps:
      - uses: namespacelabs/nscloud-setup@df198f982fcecfb8264bea3f1274b56a61b6dfdc # v0
      - name: Set up Bazel Remote Execution
        run: |
          # --command=common scopes the generated options to every bazel command instead of
          # just `build` so that the `bazel query` of the Infer Bazel Targets step below also
          # fetches repositories through Namespace's remote asset API.
          nsc bazel setup --command=common --enable_remote_asset_api --bazelrc=/tmp/bazel-rbe.bazelrc
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The Infer Bazel Targets step below diffs PRs against their base which needs history.
          fetch-depth: ${{ case(github.event_name == 'pull_request', 256, 1) }}
          ref: ${{ inputs.commit-sha }}
      - uses: ./.github/actions/netrc

      - name: Prepare the Bazel repository cache on the Namespace cache volume
        # NSC_CACHE_PATH (/cache) is set by the Namespace runner only when the profile has a
        # cache volume. It reaches this container through the env block above but is not in
        # the workflow's `env` context, so `if:` cannot test it; check it in the shell and
        # publish the result for the steps below. spacectl (run by the cache action) creates
        # the directory on the volume as the current user (buildifier) while /cache belongs
        # to the host side; pre-create it with sudo so the mount cannot fail on permissions.
        id: prepare-cache
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NSC_CACHE_PATH:-}" ]; then
            echo "No cache volume is attached (NSC_CACHE_PATH is unset); using an ephemeral repository cache."
            echo "has_volume=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$NSC_CACHE_PATH/var/cache/bazel-repository-cache"
          echo "has_volume=true" >>"$GITHUB_OUTPUT"

      - name: Mount the Bazel repository cache
        # Only runs on master commit the volume (runner-profile setting); every other run
        # reads master's last successful commit. A cache outage must not fail the job:
        # without the mount the next step is skipped and Bazel keeps its ephemeral default
        # repository cache.
        id: repo-cache
        if: steps.prepare-cache.outputs.has_volume == 'true'
        continue-on-error: true
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: /var/cache/bazel-repository-cache
          spacectl-version: 0.12.3

      - name: Configure the Bazel repository cache
        # /tmp/bazel-rbe.bazelrc is read by every bazel invocation of this job (all of them
        # run through ./.github/actions/bazel-namespace, whose bazel wrapper passes it), so one
        # `common` line reaches all of them and they keep sharing one server. Bazel puts its
        # repo contents cache (the extracted repositories) under the same directory, so a warm
        # run neither downloads nor extracts.
        if: steps.repo-cache.outcome == 'success'
        run: echo "common --repository_cache=/var/cache/bazel-repository-cache" >>/tmp/bazel-rbe.bazelrc

      - name: Prepare the scratch directory for the ic-os image builds
        # The ic-os image actions run locally (see the container options above) and each
        # writes several GB of scratch under $TMPDIR, by default /tmp: this container's
        # overlay root, a containerd snapshot on the Namespace cache volume which risks
        # filling up if the ic-os build writes its temporary scratch there.
        # $HOME is no alternative: it is on the runner's root disk, an overlayfs with layers
        # on different filesystems, where directory inode numbers are not stable, so tar
        # ("Directory renamed before its status could be extracted") and fakeroot, which
        # track files by inode, break. /namespace/scratch is a real filesystem (runs-on
        # above); a bind mount of a missing host path would only create a directory on the
        # root disk, so check that it is a non-overlay mount and fail otherwise.
        shell: bash
        run: |
          set -euo pipefail
          scratch=/namespace/scratch
          if ! mountpoint -q "$scratch" || [ "$(stat -f -c %T "$scratch")" = overlayfs ]; then
            echo >&2 "No scratch filesystem is mounted at $scratch."
            exit 1
          fi
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$scratch/tmp"
          df -h "$scratch"

      - name: Report the cache volume usage before the build
        # Whether this run is warm or cold: the cache action reports "found and restored" as
        # soon as the directory exists, which the prepare step guarantees, so only du tells.
        # The volume also holds Namespace's container image cache (/cache/containerscache).
        if: steps.repo-cache.outcome == 'success'
        continue-on-error: true
        run: |
          sudo du -xh --max-depth=2 /cache | sort -h
          du -h --max-depth=1 /var/cache/bazel-repository-cache
          df -h /cache

      - name: Infer Bazel Args
        id: infer-bazel-args
        shell: bash
        env:
          RELEASE_BUILD: ${{ needs.config.outputs.release-build }}
        run: |
          # Determine bazel_args based on event type or branch name
          bazel_args=( --config=flaky_retry ) # auto retry eg systests
          if [[ "$CI_EVENT_NAME" == 'merge_group' ]]; then
              bazel_args+=( --test_timeout_filters=short,moderate --flaky_test_attempts=3 )
          elif [[ $BRANCH_NAME =~ ^hotfix- ]]; then
              bazel_args+=( --test_timeout_filters=short,moderate )
          else
              bazel_args+=( --keep_going )
          fi

          if [[ "$RELEASE_BUILD" == 'true' ]]; then
            # make sure the version is stamped in
            bazel_args+=( --config=stamped )
          fi

          echo "bazel-args=${bazel_args[@]}" >> $GITHUB_OUTPUT

      - name: Infer Bazel Targets
        id: infer-bazel-targets
        # Backstop for the action's timeout-minutes, which stops bazel gracefully in time for
        # the action's uploads (see .github/actions/bazel-namespace/action.yaml).
        timeout-minutes: 35
        uses: ./.github/actions/bazel-namespace
        env:
          SKIP_LONG_TESTS: ${{ needs.config.outputs.skip_long_tests }}
          SKIP_BUF_CHECKS: ${{ needs.config.outputs.skip_buf_checks }}
          SKIP_SYSTEM_TESTS: ${{ needs.config.outputs.skip_system_tests }}
          DIFF_ONLY: ${{ needs.config.outputs.diff-only }}
        with:
          timeout-minutes: 30
          run: |
            # Only the `_local` variants of system-tests run in CI Main, on the RBE workers. targets.py
            # applies this exclusion after adding the targets of PULL_REQUEST_BAZEL_TARGETS, so the Farm
            # variants listed there would be dropped, which `targets.py check` (below) rejects.
            targets_args=(--exclude_tags=farm_system_test)
            if [[ "$SKIP_LONG_TESTS" == 'true' ]]; then
              targets_args+=("--skip_long_tests")
            fi
            if [[ "$SKIP_BUF_CHECKS" == 'true' ]]; then
              targets_args+=("--exclude_tags=buf")
            fi
            if [[ "$SKIP_SYSTEM_TESTS" == 'true' ]]; then
              targets_args+=("--exclude_tags=system_test")
            fi
            if [[ "$DIFF_ONLY" == 'true' ]]; then
              targets_args+=(
                '--base=${{ github.event.pull_request.base.sha }}'
                '--head=${{ github.event.pull_request.head.sha }}'
                )
            fi

            # Create the lists of targets to build and test which are consumed via
            # --target_pattern_file by the steps below. targets.py's `bazel query` runs the
            # action's bazel wrapper, so it uses the same bazel server as those steps (which
            # reuse the packages and repositories it loads) and fetches repositories through
            # Namespace's remote asset API, not DFINITY's cache, which isn't reachable from here.
            # (${{ runner.temp }} is not used since it expands to the host path.)
            mkdir -p "$HOME/bazel-targets"
            /usr/bin/time ci/scripts/targets.py build "${targets_args[@]}" >"$HOME/bazel-targets/build-targets"
            /usr/bin/time ci/scripts/targets.py test "${targets_args[@]}" >"$HOME/bazel-targets/test-targets"

      - name: Warm the Bazel repository cache for the PR queries
        id: warm-repository-cache
        # Only master runs commit the Namespace cache volume, and a master run queries
        # plain //... and builds one configuration, so on its own it never fetches the
        # repositories that only the rdeps(//..., ...) query of PR runs loads (other
        # platforms' toolchains, unselected select() branches). Load the same closure here
        # so PR runs find every repository in the cache. Same server as the steps around it.
        if: github.event_name == 'push' && env.BRANCH_NAME == 'master' && steps.repo-cache.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20 # Backstop, see "Infer Bazel Targets".
        uses: ./.github/actions/bazel-namespace
        with:
          timeout-minutes: 15
          run: |
            /usr/bin/time bazel query --keep_going 'deps(//...)' >/dev/null

      - name: Upload target files
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-targets
          retention-days: 14
          path: |
            ~/bazel-targets/build-targets
            ~/bazel-targets/test-targets

      # The job is broken up into a build and a test step so that the artifacts of release builds are
      # uploaded (and attested) even when tests fail.

      - name: Bazel Build with RBE
        id: bazel-build
        timeout-minutes: 100 # Backstop, see "Infer Bazel Targets".
        env:
          # Bazel's local strategy hands actions the client's TMPDIR (--action_env has no
          # effect on it), so this is what moves the ic-os image builds' scratch to the
          # scratch filesystem; see the "Prepare the scratch directory" step.
          TMPDIR: /namespace/scratch/tmp
        uses: ./.github/actions/bazel-namespace
        with:
          timeout-minutes: 90
          GPG_PASSPHRASE: ${{ secrets.BEP_GPG_PASSPHRASE }}
          # Compared with the one of build-ic by the build-determinism job below.
          execlogs-artifact-name: execlogs-bazel-build
          run: |
            read -r -a inferred_args <<< '${{ steps.infer-bazel-args.outputs.bazel-args }}'
            # Runs it once more after a remote execution error at Namespace (exit code 34), see the script.
            "$GITHUB_WORKSPACE/.github/actions/bazel-namespace/rerun-on-remote-error.sh" \
              bazel build "${inferred_args[@]}" --target_pattern_file="$HOME/bazel-targets/build-targets"

      - name: Configure AWS credentials
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: needs.config.outputs.release-build == 'true'
        with:
          role-session-name: "GitHub-Actions_ic_upload-artifacts"
          role-to-assume: ${{ vars.AWS_ASSUME_ROLE }}
          aws-region: eu-central-1
          # Only for the uploader, see the Upload artifacts step: the BEP files of the bazel commands
          # record their client's environment, and `nsc bazel setup` streams every bazel command's BEP
          # to Namespace's Build Event Service.
          output-env-credentials: false
          output-credentials: true

      - name: Upload artifacts
        id: upload-artifacts
        uses: ./.github/actions/upload-artifacts
        if: needs.config.outputs.release-build == 'true'
        # Backstop for the action's bazel part (timeout-minutes below), plus the upload itself
        # (about 27 minutes for the 172 files of a master build).
        timeout-minutes: 60
        with:
          name: Bazel Test All
          target: //:upload-artifacts
          # The options of the Bazel Build with RBE step above; with --check_up_to_date Bazel will error
          # out if the artifacts to be uploaded were not built in that step (this ensures that the exact
          # artifacts built above are uploaded).
          bazel-args: ${{ steps.infer-bazel-args.outputs.bazel-args }}
          check-up-to-date: 'true'
          bazel-action: bazel-namespace
          timeout-minutes: 20
          # Only the step of the action that runs the uploader gets these.
          aws-access-key-id: ${{ steps.aws-credentials.outputs.aws-access-key-id }}
          aws-secret-access-key: ${{ steps.aws-credentials.outputs.aws-secret-access-key }}
          aws-session-token: ${{ steps.aws-credentials.outputs.aws-session-token }}
          cf-aws-access-key-id: ${{ secrets.CF_AWS_ACCESS_KEY_ID }}
          cf-aws-secret-access-key: ${{ secrets.CF_AWS_SECRET_ACCESS_KEY }}

      - name: Attest
        # Mint the build-provenance attestation for the files the step above
        # uploaded, from the manifest it wrote, in this same job: no artifact
        # hop, so nothing has to be re-verified against a job output.
        # Attestations exist only for the public repo: a build from ic-private
        # gets attested when its branch is pushed to dfinity/ic as a hotfix-*
        # branch and is re-built and re-uploaded byte-identically there.
        if: needs.config.outputs.release-build == 'true' && github.repository == 'dfinity/ic'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ steps.upload-artifacts.outputs.manifest-path }}

      - name: Bazel Test with RBE
        # The id names this step's artifacts (bazel-test-all-bazel-test-<attempt>-bep and -logs),
        # which ci/githubstats/query.py recognizes as the tests of this job.
        id: bazel-test
        # Backstop, see "Infer Bazel Targets". The test step of a master run usually takes 25-40 minutes,
        # and up to about 80 when the cluster is busy; the action's timeout-minutes below leaves room for
        # a rerun of the test command (rerun-on-remote-error.sh, or the eviction retries of rbe.bazelrc).
        timeout-minutes: 160
        env:
          # Same as in the build step, for locally executed tests and actions.
          TMPDIR: /namespace/scratch/tmp
        uses: ./.github/actions/bazel-namespace
        with:
          timeout-minutes: 150
          GPG_PASSPHRASE: ${{ secrets.BEP_GPG_PASSPHRASE }}
          run: |
            read -r -a inferred_args <<< '${{ steps.infer-bazel-args.outputs.bazel-args }}'
            test_targets="$HOME/bazel-targets/test-targets"
            if [ -s "$test_targets" ]; then # bazel errors out if no test targets are listed
              # Runs it once more after a remote execution error at Namespace (exit code 34), see the script.
              "$GITHUB_WORKSPACE/.github/actions/bazel-namespace/rerun-on-remote-error.sh" \
                bazel test "${inferred_args[@]}" --target_pattern_file="$test_targets"
            fi

      - name: Report the cache volume usage at the end
        # On master this is what gets committed; compared with the report before the build
        # it tells what this run added to the volume and whether the cache needs pruning
        # before Namespace's reset-when-full kicks in.
        if: ${{ !cancelled() && steps.repo-cache.outcome == 'success' }}
        continue-on-error: true
        run: |
          sudo du -xh --max-depth=2 /cache | sort -h
          du -h --max-depth=1 /var/cache/bazel-repository-cache
          df -h /cache

  # Build & upload arm64-{linux,darwin} binaries,
  # build the entire codebase on arm64-darwin,
  # and run tests tagged to run on all platforms.
  # NOTE: uses 'namespace.so' runners.
  bazel-test-arm64:
    strategy:
      matrix:
        include:
          - os: linux
            profile: namespace-profile-arm64-linux # profile created in namespace console
          - os: darwin
            profile: namespace-profile-darwin # profile created in namespace console
    name: Bazel Test arm64-${{ matrix.os }}
    runs-on: ${{ matrix.profile }}
    timeout-minutes: 120
    needs: [config]
    # Only on the public repo. dfinity/ic-private has had Namespace runners since 2026-11-05 (bazel-test-all
    # runs there), but these arm64 runner profiles haven't been tried there yet: drop this condition once
    # they have been.
    if: github.repository == 'dfinity/ic'
    outputs:
      arm64-linux-sums: ${{ steps.sums.outputs.arm64-linux-sums }}
      arm64-darwin-sums: ${{ steps.sums.outputs.arm64-darwin-sums }}
      x86_64-darwin-sums: ${{ steps.sums.outputs.x86_64-darwin-sums }}
    steps:
      - name: Set up Bazel cache
        run: |
          # Creates a bazelrc configuration fragment which tells bazel where the cache lives.
          nsc bazel cache setup --enable_remote_asset_api --bazelrc=/tmp/bazel-cache.bazelrc
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/netrc
      - name: Build and Test
        run: |
          bazel \
            --noworkspace_rc \
            --bazelrc=./bazel/conf/.bazelrc.build --bazelrc=/tmp/bazel-cache.bazelrc \
            build \
            //publish/binaries:pocket-ic.gz \
            //publish/binaries:ic-admin.gz \
            //publish/binaries:sns.gz

          mkdir -p build
          cp \
            ./bazel-bin/publish/binaries/pocket-ic.gz \
            ./build/pocket-ic-server-arm64-${{ matrix.os }}.gz
          cp \
            ./bazel-bin/publish/binaries/ic-admin.gz \
            ./build/ic-admin-arm64-${{ matrix.os }}.gz
          cp \
            ./bazel-bin/publish/binaries/sns.gz \
            ./build/sns-arm64-${{ matrix.os }}.gz

      - name: Build pocket-ic-server x86_64-darwin
        if: ${{ matrix.os == 'darwin' }}
        run: |
          bazel \
            --noworkspace_rc \
            --bazelrc=./bazel/conf/.bazelrc.build --bazelrc=/tmp/bazel-cache.bazelrc \
            build \
            //publish/binaries:pocket-ic.gz --platforms=//:macos-intel

          mkdir -p build
          cp \
            ./bazel-bin/publish/binaries/pocket-ic.gz \
            ./build/pocket-ic-server-x86_64-darwin.gz

      - name: Record artifact checksums
        id: sums
        if: ${{ needs.config.outputs.release-build == 'true' }}
        shell: bash
        env:
          OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          cd build

          # Record the sha256sum lines of every file uploaded as an Actions
          # artifact below in this job's outputs. The
          # upload-external-artifacts job re-checks the downloaded artifacts
          # against them before re-uploading anything to the CDN: an Actions
          # artifact can be replaced mid-run by anything holding an
          # `actions: write` token, but job outputs cannot be tampered with
          # by other jobs. Recording happens right after the builds so the
          # whole-codebase build and test steps below stay outside this
          # trust chain: should any of them overwrite these files, the
          # uploaded artifact no longer matches its recorded sums and
          # verification fails loudly.
          shasum -a 256 \
            "pocket-ic-server-arm64-$OS.gz" \
            "ic-admin-arm64-$OS.gz" \
            "sns-arm64-$OS.gz" \
            | LC_ALL=C sort -k2 >"$RUNNER_TEMP/arm64-sums"
          {
            echo "arm64-$OS-sums<<SUMS"
            cat "$RUNNER_TEMP/arm64-sums"
            echo "SUMS"
          } >>"$GITHUB_OUTPUT"

          if [[ "$OS" == darwin ]]; then
            {
              echo "x86_64-darwin-sums<<SUMS"
              shasum -a 256 pocket-ic-server-x86_64-darwin.gz
              echo "SUMS"
            } >>"$GITHUB_OUTPUT"
          fi

      # Ensures that local development works on arm64-darwin.
      - name: Build the entire codebase on darwin
        if: ${{ matrix.os == 'darwin' }}
        run: |
          # We do not use `//...` here to exclude `//publish/...` which is not required for local development.
          bazel_build_targets=(
            //rs/...
            //packages/...
          )

          bazel \
            --noworkspace_rc \
            --bazelrc=./bazel/conf/.bazelrc.build --bazelrc=/tmp/bazel-cache.bazelrc \
            build \
            "${bazel_build_targets[@]}"

      - name: Run tests tagged to run on all platforms
        run: |
          # We do not use `//...` here to exclude `//publish/...` which does not build on arm64-linux.
          bazel_test_targets=(
            //rs/...
            //packages/...
          )

          bazel \
            --noworkspace_rc \
            --bazelrc=./bazel/conf/.bazelrc.build --bazelrc=/tmp/bazel-cache.bazelrc \
            test \
            --config=flaky_retry \
            --test_tag_filters="test_all_platforms,test_all_platforms_slow" \
            --build_tests_only \
            "${bazel_test_targets[@]}"

      - name: Upload pocket-ic-server x86_64-darwin
        if: ${{ matrix.os == 'darwin' && needs.config.outputs.release-build == 'true' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pocket-ic-server-x86_64-darwin.gz
          path: ./build/pocket-ic-server-x86_64-darwin.gz

      - name: Upload arm64-${{ matrix.os }} artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ needs.config.outputs.release-build == 'true' }}
        with:
          name: arm64-binaries-${{ matrix.os }}.gz
          path: |
            ./build/pocket-ic-server-arm64-${{ matrix.os }}.gz
            ./build/ic-admin-arm64-${{ matrix.os }}.gz
            ./build/sns-arm64-${{ matrix.os }}.gz

  # Upload external artifacts, retrieved from non-DFINITY runner builds.
  upload-external-artifacts:
    name: Upload external artifacts
    needs: [bazel-test-arm64, config]
    if: ${{ needs.config.outputs.release-build == 'true' }} # GHA output quirk, 'true' is a string
    # The `Upload artifacts` step below requires the AWS & CF secrets
    # which are only available in the `upload-artifacts` environment.
    environment: upload-artifacts
    runs-on: *dind-large-setup
    container: *container-setup
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download arm64-linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arm64-binaries-linux.gz
          # avoid downloading to workspace to avoid version being marked as dirty
          path: ~/.cache/arm64-binaries-linux

      - name: Download arm64-darwin artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arm64-binaries-darwin.gz
          # avoid downloading to workspace to avoid version being marked as dirty
          path: ~/.cache/arm64-binaries-darwin

      - name: Download pocket-ic-server (x86_64-darwin)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pocket-ic-server-x86_64-darwin.gz
          # avoid downloading to workspace to avoid version being marked as dirty
          path: ~/.cache/pocket-ic-server-x86_64-darwin

      - name: Verify downloaded artifacts
        shell: bash
        env:
          ARM64_LINUX_SUMS: ${{ needs.bazel-test-arm64.outputs.arm64-linux-sums }}
          ARM64_DARWIN_SUMS: ${{ needs.bazel-test-arm64.outputs.arm64-darwin-sums }}
          X86_64_DARWIN_SUMS: ${{ needs.bazel-test-arm64.outputs.x86_64-darwin-sums }}
        run: |
          set -euo pipefail

          # Re-check every file downloaded above against the sha256sum lines
          # the producing bazel-test-arm64 legs recorded in their job
          # outputs, before anything is bundled and re-uploaded to the CDN:
          # an Actions artifact can be replaced mid-run by anything holding
          # an `actions: write` token, but job outputs cannot be tampered
          # with by other jobs. A missing or empty output also fails here:
          # sha256sum rejects input without valid checksum lines.
          check() { # <download-dir> <recorded sha256sum lines>
            echo "$2" | (cd "$1" && sha256sum --check --strict)
            # Also reject artifacts carrying anything beyond the recorded files
            diff <(echo "$2" | awk '{print $2}' | LC_ALL=C sort) \
              <(cd "$1" && find . -mindepth 1 | sed 's|^\./||' | LC_ALL=C sort)
          }
          check ~/.cache/arm64-binaries-linux "$ARM64_LINUX_SUMS"
          check ~/.cache/arm64-binaries-darwin "$ARM64_DARWIN_SUMS"
          check ~/.cache/pocket-ic-server-x86_64-darwin "$X86_64_DARWIN_SUMS"

      - name: Prepare bundle
        id: prepare-bundle
        run: |
          bundledir=$(mktemp -d)

          # Create a "bundle" that the uploader can digest
          mkdir -p "$bundledir/binaries/arm64-linux/"
          cp ~/.cache/arm64-binaries-linux/pocket-ic-server-arm64-linux.gz "$bundledir/binaries/arm64-linux/pocket-ic.gz"
          cp ~/.cache/arm64-binaries-linux/ic-admin-arm64-linux.gz "$bundledir/binaries/arm64-linux/ic-admin.gz"
          cp ~/.cache/arm64-binaries-linux/sns-arm64-linux.gz "$bundledir/binaries/arm64-linux/sns.gz"

          mkdir -p "$bundledir/binaries/arm64-darwin/"
          cp ~/.cache/arm64-binaries-darwin/pocket-ic-server-arm64-darwin.gz "$bundledir/binaries/arm64-darwin/pocket-ic.gz"
          cp ~/.cache/arm64-binaries-darwin/ic-admin-arm64-darwin.gz "$bundledir/binaries/arm64-darwin/ic-admin.gz"
          cp ~/.cache/arm64-binaries-darwin/sns-arm64-darwin.gz "$bundledir/binaries/arm64-darwin/sns.gz"

          mkdir -p "$bundledir/binaries/x86_64-darwin/"
          cp ~/.cache/pocket-ic-server-x86_64-darwin/pocket-ic-server-x86_64-darwin.gz "$bundledir/binaries/x86_64-darwin/pocket-ic.gz"

          # Give these hand-assembled directories the same SHA256SUMS file that the bazel-built bundles get
          # from the artifact_bundle rule so every binaries/<platform>/ directory on the CDN carries a
          # checksum manifest that release workflows can verify against its attestation.
          (cd "$bundledir/binaries/arm64-linux" && sha256sum *.gz | LC_ALL=C sort -k2 >SHA256SUMS)
          (cd "$bundledir/binaries/arm64-darwin" && sha256sum *.gz | LC_ALL=C sort -k2 >SHA256SUMS)
          (cd "$bundledir/binaries/x86_64-darwin" && sha256sum *.gz | LC_ALL=C sort -k2 >SHA256SUMS)

          echo bundledir="$bundledir" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-session-name: "GitHub-Actions_ic_upload-artifacts"
          role-to-assume: ${{ vars.AWS_ASSUME_ROLE }}
          aws-region: eu-central-1
          # Only for the Upload artifacts step, as in bazel-test-all.
          output-env-credentials: false
          output-credentials: true

      - name: Upload artifacts
        id: upload-artifacts
        uses: ./.github/actions/upload-artifacts
        with:
          name: arm64 artifacts
          target: //:artifact-uploader
          bazel-args: --config=stamped
          program-args: ${{ steps.prepare-bundle.outputs.bundledir }}
          # Only the step of the action that runs the uploader gets these.
          aws-access-key-id: ${{ steps.aws-credentials.outputs.aws-access-key-id }}
          aws-secret-access-key: ${{ steps.aws-credentials.outputs.aws-secret-access-key }}
          aws-session-token: ${{ steps.aws-credentials.outputs.aws-session-token }}
          cf-aws-access-key-id: ${{ secrets.CF_AWS_ACCESS_KEY_ID }}
          cf-aws-secret-access-key: ${{ secrets.CF_AWS_SECRET_ACCESS_KEY }}

      - name: Attest
        # See the Attest step of bazel-test-all.
        if: needs.config.outputs.release-build == 'true' && github.repository == 'dfinity/ic'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ steps.upload-artifacts.outputs.manifest-path }}

  python-ci-tests:
    name: Python CI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Run Python CI Tests
        shell: bash
        run: |
          set -xeuo pipefail
          export PYTHONPATH=$PWD/ci/src:$PWD/ci/src/dependencies
          # Ignore externally-managed-environment pip error, install packages system-wide.
          PIP_BREAK_SYSTEM_PACKAGES=1 pip3 install --ignore-installed -r requirements.txt
          cd ci/src
          pytest -m "not fails_on_merge_train" -v -o junit_family=xunit1 \
            --junitxml=../../test_report.xml --cov=. --cov-report=term \
            --cov-report=term-missing --cov-report=html --cov-branch
        env:
          CI_COMMIT_REF_PROTECTED: ${{ github.ref_protected }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO_NAME: ${{ github.repository }}

  build-ic:
    needs: [config]
    name: Build IC
    runs-on: *dind-large-setup
    container: *container-setup
    timeout-minutes: 90
    if: ${{ github.event_name != 'merge_group' }}
    steps:
      - *checkout
      - uses: ./.github/actions/netrc
      - name: "Node Name"
        run: |
          echo "::notice::Node Name: ${NODE_NAME}"
      - name: Run Build IC
        uses: ./.github/actions/bazel
        env:
          RELEASE_BUILD: ${{ needs.config.outputs.release-build }}
        with:
          execlogs-artifact-name: execlogs-build-ic
          run: |
            set -euo pipefail

            cd "$CI_PROJECT_DIR"

            # Always build all IC-OS images, canisters and binaries: this is the
            # no-cache side of the build-determinism comparison. Only release builds are stamped.
            build_args=(-i -c -b)
            if [[ "$RELEASE_BUILD" != 'true' ]]; then
              build_args+=(--no-release)
            fi
            ci/container/build-ic.sh "${build_args[@]}"

  build-determinism:
    name: Build Determinism
    runs-on: ubuntu-latest
    needs: [build-ic, bazel-test-all]
    # Run even when `bazel-test-all` fails: its test failures happen *after*
    # its build succeeded, its execution logs were uploaded (the bazel action
    # uploads them on failure too) and — on release builds — the artifacts
    # were already published to the CDN. Without this condition a single
    # failing/flaky test silently skipped the determinism check while the
    # artifacts still shipped. `build-ic` still has to succeed: it produces the
    # no-cache side of the comparison (and is skipped on merge_group, where
    # there is nothing to compare).
    if: ${{ !cancelled() && needs.build-ic.result == 'success' }}
    steps:
      - name: Download execution logs (cache)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: execlogs-bazel-build
          path: execlogs-cache
      - name: Download execution logs (nocache)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: execlogs-build-ic
          path: execlogs-nocache
      - name: Build Determinism Test
        run: |
          set -euo pipefail

          n_lines_cache=$(cat execlogs-cache/execlogs.csv | wc -l)
          n_lines_nocache=$(cat execlogs-nocache/execlogs.csv | wc -l)
          echo "comparing $n_lines_cache (cache) and $n_lines_nocache (nocache) lines"

          # Outside pull requests both jobs build everything, so every artifact of the nocache side
          # should be in the cache side. But the cache side can be incomplete: when bazel retries a
          # build after a remote-cache eviction (--experimental_remote_cache_eviction_retries), its
          # compact execution log only covers the last attempt, and this check would silently compare
          # less. So warn when many artifacts are missing from it, also when it is empty.
          warn_if_low_coverage() { # <number of artifacts present in both>
            if [ "$CI_EVENT_NAME" != "pull_request" ] && [ "$1" -lt $(((n_lines_nocache + 1) / 2)) ]; then
              echo "::warning title=Build Determinism::only $1 of the $n_lines_nocache artifacts built by build-ic are in the execution log of bazel-test-all"
            fi
          }

          # running tests may not pull all targets locally. If that's the case,
          # there will be 0 lines and nothing to compare.
          if [ "$n_lines_cache" -eq 0 ] || [ "$n_lines_nocache" -eq 0 ]; then
            warn_if_low_coverage 0
            echo "No lines to compare"
            exit 0
          fi

          # sort the files by the field we join on (artifact path), see below
          sponge=$(mktemp)

          sort -t, -k2 <execlogs-cache/execlogs.csv >"$sponge"
          cp "$sponge" execlogs-cache/execlogs.csv

          sort -t, -k2 <execlogs-nocache/execlogs.csv >"$sponge"
          cp "$sponge" execlogs-nocache/execlogs.csv

          rm "$sponge"

          # How many artifacts the comparison covers, see warn_if_low_coverage above.
          n_joined=$(join -t, -12 -22 execlogs-cache/execlogs.csv execlogs-nocache/execlogs.csv | wc -l)
          echo "comparing $n_joined artifacts present in both"
          warn_if_low_coverage "$n_joined"

          # join the CSVs (separator ',') and compare the hashes. This creates a table with the following columns:
          #   //rs/foo,bazel-out/path/to-artifact,deadbeef,deafb33f
          # target label (1.1), artifact path (1.2), and hashes (1.3 & 2.3). The join is done
          # on the artifact path, second field on input one (-1) and input two (-2) :'-12 -22'
          # The output is then compared with awk, printing mismatches, and keeping track of how many mismatches we
          # encountered.
          join \
            -t, -o 1.1,1.2,1.3,2.3 -12 -22 \
            execlogs-cache/execlogs.csv \
            execlogs-nocache/execlogs.csv \
            | awk -F, 'BEGIN { N_BAD=0; } $3 != $4 { print $1 " " $2 ": " $3 " != " $4; N_BAD++; } END { if (N_BAD) { print N_BAD " mismatches found"; exit 1; } else { print "No mismatches"; }; }' \
            | column -t | sort

  cargo-linux:
    strategy:
      matrix:
        include:
          - name: Lint
          - name: Build
    name: Cargo  ${{ matrix.name }} Linux
    runs-on:
      labels: dind-small
    container: *container-setup
    timeout-minutes: 30
    steps:
      - *checkout
      - name: Filter Rust Files [*.{rs,toml,lock}]
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          ref: ${{ inputs.commit-sha }}
          filters: |
            cargo:
              - "**/*.rs"
              - "**/*.toml"
              - "**/*.lock"
              - "ci/scripts/rust-lint.sh"
              - "ci/container/TAG"
              - "ci/container/ic-build.digest"
              - "ci/container/ic-dev.digest"
              - ".github/**"
      - name: Run Cargo ${{ matrix.name }} Linux
        if: |
          steps.filter.outputs.cargo == 'true' ||
          contains(github.event.pull_request.labels.*.name, 'CI_RUN_CARGO_JOBS') ||
          env.BRANCH_NAME == 'master' ||
          startsWith(env.BRANCH_NAME, 'rc--') ||
          startsWith(env.BRANCH_NAME, 'hotfix-')
        shell: bash
        env:
          # on dind_small cargo sometimes runs out of files (when building and linting). This trades
          # some performance for reliability.
          # (at the time of writing, nproc returns 64 on dind_small where this job runs)
          CARGO_BUILD_JOBS: 32
        run: |
          set -eExuo pipefail
          export CARGO_TERM_COLOR=always # ensure output has colors

          if [[ "${{ matrix.name }}" == "Lint" ]]; then
            "$CI_PROJECT_DIR"/ci/scripts/rust-lint.sh
          else
            cargo build --release --locked
          fi

  check-pull-request-bazel-targets:
    name: Check PULL_REQUEST_BAZEL_TARGETS
    runs-on:
      labels: dind-small
    container: *container-setup
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/netrc
      - name: Check PULL_REQUEST_BAZEL_TARGETS
        uses: ./.github/actions/bazel
        with:
          # The exclusion of the Infer Bazel Targets step of bazel-test-all, so that a Farm variant of a
          # system-test listed in PULL_REQUEST_BAZEL_TARGETS fails the check instead of silently not running.
          run: ./ci/scripts/targets.py check --exclude_tags=farm_system_test

# only run on pull-request event - they are also triggered from schedule-daily.yml
  pocket-ic-tests-windows:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pocket-ic-tests-windows.yml
    with:
      commit-sha: ${{ github.sha }}

  test-container-run:
    name: Test Container Run ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: TestCase 1
            command: ""
          - name: TestCase 2
            command: "--image ic-build bash"
    steps:
      - *checkout
      - name: Workaround for actions/runner-images#14473 (crun pinning)
        run: |
          # Workaround for actions/runner-images#14473:
          # Podman 5.x on ubuntu-24.04/22.04 picks /usr/bin/crun (1.14.1) over
          # /usr/local/bin/crun (1.28). Pin it explicitly.
          #
          # container-run.sh always invokes podman as `sudo podman`, which
          # resets $HOME, so a per-user containers.conf drop-in under $HOME
          # would never be seen by (rootful) podman. Instead, use
          # container-run.sh's own ~/.container-run.conf hook: it is sourced
          # in the invoking (non-root) shell *before* `sudo podman run` is
          # exec'd, and PODMAN_RUN_USR_ARGS is appended as CLI args to that
          # `podman run` call -- which, unlike $HOME, survive sudo.
          if command -v podman &>/dev/null && [ -x /usr/local/bin/crun ]; then
            echo 'PODMAN_RUN_USR_ARGS=(--runtime /usr/local/bin/crun)' >>~/.container-run.conf
          fi
      - name: Check image pins
        # Not behind the path filter: the pins are rewritten together by
        # container-autobuild.yml, and a hand edit or a merge that keeps an
        # older pin makes container-run.sh and CI run different images.
        run: ./ci/container/check-image-pins.sh
      - name: Filter Relevant Files
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          ref: ${{ inputs.commit-sha }}
          filters: |
            container-run:
              - '.github/workflows/ci-pr-only.yml'
              - '.github/workflows/container-autobuild.yml'
              - 'ci/container/**'
      - name: Test Container Run
        if: |
          steps.filter.outputs.container-run == 'true' ||
          env.BRANCH_NAME == 'master' ||
          startsWith(env.BRANCH_NAME, 'rc--') ||
          startsWith(env.BRANCH_NAME, 'hotfix-')
        run: |
          ./ci/container/container-run.sh ${{ matrix.command }}
