name: 'Upload execution logs'
description: |
  Converts the compact execution logs of bazel commands to one CSV with execlog2csv and uploads it
  to GitHub as an artifact, for the build-determinism job of .github/workflows/ci-main.yml.

  The bazel wrappers of ./.github/actions/bazel and ./.github/actions/bazel-namespace write the
  execution logs of their build and test commands (--execution_log_compact_file) as execlog-*.zst
  files into a directory, which the callers pass as `execlogs-dir`. The CSV, execlogs.csv, has one
  "<target label>,<output path>,<sha256>" line per action output and is uploaded as the artifact
  `artifact-name`. Shared by both bazel actions so that the execlog2csv version, its pinned sha256s
  and the list of known non-reproducible targets live in one place. The callers decide when to run
  it, e.g. not when the job was cancelled.
inputs:
  execlogs-dir:
    required: true
    description: The directory holding the execlog-*.zst files. execlogs.csv is written next to them.
  artifact-name:
    required: true
    description: The name of the uploaded artifact, which must be unique in the workflow run.

runs:
  using: composite
  steps:
    # We use execlog2csv to process the proto-based execution logs and convert them
    # to CSV for easier processing
    - name: Install execlog2csv
      shell: bash
      run: |
        cd $(mktemp -d)

        version="0.0.2" # execlog2csv version

        # for more platforms see artifacts list:
        # https://github.com/dfinity/execlog2csv/releases/latest
        if [[ $(uname -m) == "x86_64" ]]; then
          arch="amd64"
        # Linux reports aarch64 here, Darwin (Apple Silicon) reports arm64.
        elif [[ $(uname -m) == "aarch64" || $(uname -m) == "arm64" ]]; then
          arch="arm64"
        else
          echo "unexpected architecture: '$(uname -m)'"
          exit 1
        fi

        if [[ $(uname) == "Linux" ]]; then
          os="linux"
        elif [[ $(uname) == "Darwin" ]]; then
          os="darwin"
        else
          echo "unexpected os: '$(uname)'"
          exit 1
        fi

        filename="execlog2csv_${version}_${os}_${arch}"
        echo "filename: $filename"

        # sha256 of the release zips.
        #
        # GitHub release assets are mutable under an existing tag, so the download is
        # only trustworthy when checked against a hash recorded here, in this repo.
        # NOTE: these MUST be updated together with `version` above. Refresh with:
        #   curl -fsSL "https://github.com/dfinity/execlog2csv/releases/download/v$version/execlog2csv_${version}_SHA256SUMS"
        case "${os}_${arch}" in
          linux_amd64)  sha256=cfbeeae1b2138742e3953ad0a7d55cbd11e0bf0dfe96d00e75b45c46e186244e ;;
          linux_arm64)  sha256=f68aa6317becf85436db8983f76cd06fea7544ec25e0a75e71d8fc8178e2d2b2 ;;
          darwin_amd64) sha256=095dcb5f07b1c6e8edb0293b6abad60c519dea1d0b25090dadc15bf42539700f ;;
          darwin_arm64) sha256=1ca6ebc9b2b4a5e50fad9013978398c8f5cc7f33318cb1528e6fb0879f32b5c6 ;;
          *)
            echo "no pinned sha256 for '${os}_${arch}'"
            exit 1
            ;;
        esac

        dl_url="https://github.com/dfinity/execlog2csv/releases/download/v$version/$filename.zip"
        echo "downloading '$dl_url'"
        curl -fSLO --retry 7 "$dl_url"

        # Verify the download before unpacking or executing any of it.
        if command -v sha256sum >/dev/null; then
          echo "$sha256  $filename.zip" | sha256sum --check
        else
          echo "$sha256  $filename.zip" | shasum -a 256 --check
        fi

        unzip "$filename.zip"
        sudo mv "./execlog2csv_v$version" /usr/local/bin/execlog2csv
        rm "$filename.zip"
        execlog2csv --help

    - name: Convert the execution logs to CSV
      shell: bash
      env:
        EXECLOGS_DIR: ${{ inputs.execlogs-dir }}
      run: |
        execlog="$(mktemp)"
        trap "rm -f $execlog" INT TERM EXIT
        # The goal is to have as few non-reproducible bazel targets as possible.
        # So we forbid all of them except for the following known ones:
        excludes=(
          ^@@rules_rust..crate.crate_index__cranelift-assembler-x64   # has a non reproducible generated-files.rs in its OUT_DIR.
          ^@@rules_rust..crate.crate_index__cranelift-isle            # has a non reproducible isle_tests.rs in its OUT_DIR.
          ^@@rules_rust..crate.crate_index__secp256k1-sys             # has non reproducible object files, like lax_der_parsing.o, in it OUT_DIR.
          ^@@rules_rust..crate.crate_index__sev                       # build.rs depends on the presence of /dev/sev and /dev/sev-guest. See: https://github.com/virtee/sev/issues/315
          # TODO: fix the following ASAP:
          ^//ic-os/hostos/envs/prod:rootfs-tree.tar                   # became non-reproducible because of https://github.com/dfinity/ic/pull/10208
          ^//ic-os/setupos/envs/prod:rootfs-tree.tar                  # idem
        )
        for execlog_zst in $(find "$EXECLOGS_DIR" -name 'execlog-*.zst'); do
          zstd -f -d "$execlog_zst" -o "$execlog"
          execlog2csv \
            --input_execlog="$execlog" \
            --exclude "${excludes[*]}"
        done > "$EXECLOGS_DIR/execlogs.csv"

    - name: Upload the execution logs
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.execlogs-dir }}/execlogs.csv
