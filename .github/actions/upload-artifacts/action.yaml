name: Upload Artifacts
description: |
  Run an artifact upload command and set a step summary. The upload command must write one
  sha256sum-format line per uploaded file ("<sha256>  ic/<path>") to stdout; the collected
  lines form the upload manifest exposed through the `manifest-path` output, which the
  calling job attests.
inputs:
  upload-command:
    required: true
  name:
    required: true
outputs:
  manifest-path:
    description: |
      Path of the upload manifest: one "<sha256>  ic/<path>" line per uploaded file
      (sha256sum format, suitable for actions/attest's `subject-checksums` input).
    value: ${{ steps.manifest.outputs.path }}

runs:
  using: "composite"
  steps:
    - name: Upload to S3
      uses: ./.github/actions/bazel
      with:
        run: |
          echo uploading artifacts to remote storage
          upload_output="$RUNNER_TEMP/upload-manifest.sha256sums"

          ${{ inputs.upload-command }} >"$upload_output"

          n_uploaded=$(wc -l <"$upload_output")
          echo "'$n_uploaded' artifacts uploaded"

          # the upload list can get quite big, so we wrap it in details/summary
          {
            echo '<details><summary>Uploaded '"$n_uploaded"' Artifacts for ${{ inputs.name }}</summary>';
            echo
            echo '```'
            cat "$upload_output"
            echo '```'
            echo
            echo '</details>';
          } >>"$GITHUB_STEP_SUMMARY"

    - name: Check manifest
      id: manifest
      shell: bash
      run: |
        set -euo pipefail
        manifest="$RUNNER_TEMP/upload-manifest.sha256sums"

        # Fail rather than attest garbage: the manifest must be
        # non-empty and every line must be "<64-hex>  ic/<path>".
        if ! [ -s "$manifest" ]; then
          echo "upload manifest is missing or empty: $manifest" >&2
          exit 1
        fi
        if grep -Ev '^[0-9a-f]{64}  ic/[A-Za-z0-9._/-]+$' "$manifest"; then
          echo "upload manifest contains malformed lines (printed above)" >&2
          exit 1
        fi

        echo "path=$manifest" >>"$GITHUB_OUTPUT"
